name: Dynamic CVE Rule Learning

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  learn-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Sync Advisories and Synthesize Verified Candidate Rules
        id: learn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm run sync:advisories
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$OPENAI_API_KEY" ] || [ -n "$GITHUB_TOKEN" ]; then
            node src/cli.js learn --limit 5 || true
          else
            echo "No LLM provider token available; skipping rule synthesis."
          fi
          if [ -n "$(git status --porcelain rules/)" ]; then
            echo "has_rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rules=false" >> "$GITHUB_OUTPUT"
            echo "No new rules learned; skipping bundle and PR creation."
          fi

      - name: Validate, Bundle, and Benchmark Learned Rules
        if: steps.learn.outputs.has_rules == 'true'
        run: |
          npm run validate
          npm run bundle
          npm test
          npm run bench
          npm run bench:accuracy

      - name: Open Pull Request for Verified Rules
        id: create_pr
        if: steps.learn.outputs.has_rules == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(rules): add dynamically learned CVE rules"
          title: "chore(rules): add verified CVE rules from internet feeds"
          body: "Automated candidate rules synthesized from verified advisories and validated through schema, ReDoS, fixture, AI FP review, and clean-corpus accuracy checks."
          branch: chore/learned-rules
          delete-branch: true

      - name: Auto-Merge Verified Rules PR
        id: merge_pr
        if: steps.learn.outputs.has_rules == 'true' && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --delete-branch || gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --squash --delete-branch

      - name: Trigger wide-action Bundle Sync
        if: steps.learn.outputs.has_rules == 'true' && steps.merge_pr.outcome == 'success'
        env:
          WIDE_ECOSYSTEM_TOKEN: ${{ secrets.WIDE_ECOSYSTEM_TOKEN }}
        run: |
          if [ -z "$WIDE_ECOSYSTEM_TOKEN" ]; then
            echo "WIDE_ECOSYSTEM_TOKEN secret not configured; skipping cross-repo dispatch to sl4de0day/wide-action."
            exit 0
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WIDE_ECOSYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sl4de0day/wide-action/dispatches \
            -d "{\"event_type\":\"wide-rules-updated\",\"client_payload\":{\"source\":\"wide-rules\",\"sha\":\"${GITHUB_SHA}\"}}"
