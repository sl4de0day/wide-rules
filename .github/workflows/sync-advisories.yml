name: Sync Security Advisories

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-advisories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Sync Internet Advisories (GHSA + CISA KEV + OSV + FIRST EPSS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:advisories

      - name: Bundle and Verify Rules + OSV
        run: |
          npm run validate
          npm run bundle
          npm test
          npm run bench

      - name: Commit Updated Advisories
        id: commit
        run: |
          git config user.name "wide-rules-bot"
          git config user.email "wide-rules-bot@users.noreply.github.com"
          git add data/osv-advisories.json data/raw-advisories.json dist/osv-bundle.json dist/osv-bundle.min.json dist/rules.json dist/rules.min.json dist/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "chore(advisories): sync OSV/GHSA/KEV/EPSS feeds"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger wide-action Bundle Sync
        if: steps.commit.outputs.changed == 'true'
        env:
          WIDE_ECOSYSTEM_TOKEN: ${{ secrets.WIDE_ECOSYSTEM_TOKEN }}
        run: |
          if [ -z "$WIDE_ECOSYSTEM_TOKEN" ]; then
            echo "WIDE_ECOSYSTEM_TOKEN secret not configured; skipping cross-repo dispatch to sl4de0day/wide-action."
            exit 0
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WIDE_ECOSYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sl4de0day/wide-action/dispatches \
            -d "{\"event_type\":\"wide-rules-updated\",\"client_payload\":{\"source\":\"wide-rules\",\"sha\":\"${GITHUB_SHA}\"}}"
