name: Sync Security Advisories

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wide-rules-bot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Sync Internet Advisories (GHSA + CISA KEV + OSV + FIRST EPSS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:advisories

      - name: Bundle and Verify Rules + OSV
        run: |
          npm run validate
          npm run bundle
          npm test
          npm run bench

      - name: Open Pull Request for Advisory Sync
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WIDE_ECOSYSTEM_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: |
            data/osv-advisories.json
            data/raw-advisories.json
            dist/osv-bundle.json
            dist/osv-bundle.min.json
            dist/rules.json
            dist/rules.min.json
            dist/SHA256SUMS
          commit-message: "chore(advisories): sync OSV/GHSA/KEV/EPSS feeds"
          committer: wide-rules-bot <wide-rules-bot@users.noreply.github.com>
          author: wide-rules-bot <wide-rules-bot@users.noreply.github.com>
          title: "chore(advisories): sync OSV/GHSA/KEV/EPSS feeds"
          body: "Automated advisory sync from GHSA, CISA KEV, OSV and FIRST EPSS, verified with validate, bundle, test and bench."
          branch: chore/advisory-sync
          delete-branch: true

      - name: Auto-Merge Advisory PR After Required Checks
        id: merge_pr
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          for i in $(seq 1 80); do
            state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state -q .state)
            if [ "$state" = "MERGED" ]; then
              sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit -q .mergeCommit.oid)
              echo "merge_sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "PR #$PR_NUMBER was closed without merging."
              exit 1
            fi
            sleep 30
          done
          echo "PR #$PR_NUMBER was not merged within 40 minutes; required checks may not have run."
          exit 1

      - name: Trigger wide-action Bundle Sync
        if: steps.merge_pr.outputs.merge_sha != ''
        env:
          WIDE_ECOSYSTEM_TOKEN: ${{ secrets.WIDE_ECOSYSTEM_TOKEN }}
          MERGE_SHA: ${{ steps.merge_pr.outputs.merge_sha }}
        run: |
          if [ -z "$WIDE_ECOSYSTEM_TOKEN" ]; then
            echo "WIDE_ECOSYSTEM_TOKEN secret not configured; skipping cross-repo dispatch to sl4de0day/wide-action."
            exit 0
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WIDE_ECOSYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sl4de0day/wide-action/dispatches \
            -d "{\"event_type\":\"wide-rules-updated\",\"client_payload\":{\"source\":\"wide-rules\",\"sha\":\"${MERGE_SHA}\"}}"
