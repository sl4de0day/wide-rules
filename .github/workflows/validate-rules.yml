name: Validate Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Validate Rules
        run: npm run validate

      - name: Build Rule Bundle
        run: npm run bundle

      - name: Run Test Suite
        run: npm test

      - name: Run ReDoS and Accuracy Benchmarks
        run: |
          npm run bench
          npm run bench:accuracy
