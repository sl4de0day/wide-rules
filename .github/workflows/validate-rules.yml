name: Validate Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Validate Rules
        run: npm run validate

      - name: Build Rule Bundle
        run: npm run bundle

      - name: Run Test Suite
        run: npm test
