id: wide/sql-concatenation
name: sql-concatenation
category: INJECTION
severity: CRITICAL
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
  - py
