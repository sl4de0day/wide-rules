id: wide/ssti-chameleon-page-template
name: ssti-chameleon-page-template
category: INJECTION
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-1336
pattern: \bPageTemplate\s*\(\s*(?:(?!(?:filename|file|uri|lookup|name|encoding)\s*=)[A-Za-z_]\w*\s*=\s*)?(?:[rbuRBU]{0,2}f['"]|['"][^'"\n]*['"]\s*(?:\+|%|\.\s*format)|(?![rbufRBUF]{0,2}['"])[A-Za-z_][\w.]*(?![\w.])(?!\s*=[^=]))
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Use PageTemplate with a constant template string or PageTemplateFile pointing at a trusted file, and pass user input only as template variables.
why: Chameleon's PageTemplate compiles its string argument as a ZPT/TAL template that evaluates embedded Python, so a dynamic template body lets attacker input run as expressions (PageTemplateFile, which loads a fixed file, is intentionally excluded by requiring '(' immediately after PageTemplate).
confidence: high
