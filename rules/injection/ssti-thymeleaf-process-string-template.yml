id: wide/ssti-thymeleaf-process-string-template
name: ssti-thymeleaf-process-string-template
category: INJECTION
severity: HIGH
languages:
  - java
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|\*)).*?[A-Za-z_$]*[Tt]emplate[A-Za-z_$]*[Ee]ngine\s*\.\s*process\s*\(\s*(?:[A-Za-z_$]|(?:"[^"]*"|'[^']*')\s*(?:\+(?!\s*["'])|\.\s*(?:format|formatted)\s*\())[^;]*,
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Pass a fixed template name (resolved from the classpath) as the first argument and supply user input only via the Context variables.
why: With a StringTemplateResolver, TemplateEngine.process treats its first argument as the template itself, and Thymeleaf's expression preprocessing (__${...}__) over dynamic template text yields SpEL execution and RCE.
confidence: high
