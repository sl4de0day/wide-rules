id: wide/ssti-twig-create-template
name: ssti-twig-create-template
category: INJECTION
severity: HIGH
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|#|\*)).*?->createTemplate\s*\(\s*(?:\$|(?:'[^']*'|"[^"]*")\s*\.\s*[\$A-Za-z_]|"[^"]*\$\{?[A-Za-z_])
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Load a fixed template file (or a constant string) and pass user input only through the render() context array; never build the template source from user data.
why: Twig's createTemplate() compiles its string argument as a full Twig template, so a dynamic source lets an attacker inject Twig expressions that reach PHP and lead to RCE.
confidence: high
