id: wide/ssti-nustache-stringtostring
name: ssti-nustache-stringtostring
category: INJECTION
severity: HIGH
languages:
  - cs
  - csx
cwe: CWE-1336
pattern: ^(?!\s*(?:\/\/|\/\*|\*)).*\bRender\.StringToString\s*\(\s*(?:(?:\$@?|@\$)"|@?"[^"]*"\s*\+|[A-Za-z_][\w.]*\s*[\[(+,)])
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Render a fixed literal template string and pass user input only as the data argument, never as the template parameter.
why: Nustache's Render.StringToString treats its first argument as the Mustache template source; user-controlled source lets an attacker traverse the data object and inject sections (SSTI).
confidence: high
