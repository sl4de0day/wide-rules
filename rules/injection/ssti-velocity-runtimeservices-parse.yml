id: wide/ssti-velocity-runtimeservices-parse
name: ssti-velocity-runtimeservices-parse
category: INJECTION
severity: HIGH
languages:
  - java
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|\*)).*?(?:[A-Za-z_$]*[Rr]untime[A-Za-z_$]*|rsvc)\s*\.\s*parse\s*\(\s*new\s+StringReader\s*\(\s*(?:[A-Za-z_$]|(?:"[^"]*"|'[^']*')\s*(?:\+(?!\s*["'])|\.\s*(?:format|formatted)\s*\())
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Do not parse a StringReader built from user input; resolve templates by resource name and bind user data through the context.
why: Velocity RuntimeServices.parse compiles the Reader it is given into a template AST; wrapping a dynamic string in a StringReader makes that user input executable VTL.
confidence: high
