id: wide/ssti-go-pongo2-fromstring
name: ssti-go-pongo2-fromstring
category: INJECTION
severity: HIGH
languages:
  - go
cwe: CWE-1336
pattern: ^(?!\s*(?:\/\/|\/\*|\*)).*\bpongo2\.(?:FromString|FromBytes|RenderTemplateString)\(\s*(?:\[\]byte\(\s*|\[\]rune\(\s*)?(?:[A-Za-z_]|[\x22\x60][^\x22\x60]*[\x22\x60]\s*\+)
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Compile a fixed literal (or a file from a trusted path via pongo2.FromFile) once and supply user input only inside the pongo2.Context data map.
why: pongo2.FromString/FromBytes/RenderTemplateString compile their first argument as Django-style template SOURCE, so a dynamic value there (including a []byte(...) conversion of request input) lets an attacker inject tags/filters and traverse the context.
confidence: high
