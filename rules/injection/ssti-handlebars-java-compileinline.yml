id: wide/ssti-handlebars-java-compileinline
name: ssti-handlebars-java-compileinline
category: INJECTION
severity: HIGH
languages:
  - java
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|\*)).*?\.\s*compileInline\s*\(\s*(?:[A-Za-z_$]|(?:"[^"]*"|'[^']*')\s*(?:\+(?!\s*["'])|\.\s*(?:format|formatted)\s*\())
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Use handlebars.compile(location) with a fixed template resource and pass user input only through the model/context.
why: Handlebars.compileInline compiles its argument as an inline template, so a dynamic argument lets an attacker inject Handlebars/helper expressions that can leak context or, via helpers, reach code execution.
confidence: high
