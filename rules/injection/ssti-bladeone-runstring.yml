id: wide/ssti-bladeone-runstring
name: ssti-bladeone-runstring
category: INJECTION
severity: HIGH
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|#|\*)).*?->runString\s*\(\s*(?:\$|(?:'[^']*'|"[^"]*")\s*\.\s*[\$A-Za-z_]|"[^"]*\$\{?[A-Za-z_])
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Pass a fixed Blade string as the template and supply user values only through runString()'s data array, never as the template argument.
why: BladeOne's runString() compiles and evaluates its first argument as a Blade template, so a dynamic template string permits directive injection and PHP execution.
confidence: high
