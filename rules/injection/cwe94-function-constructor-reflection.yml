cwe: CWE-94
pattern: \.constructor\s*\.\s*constructor
message: Reflective access to .constructor.constructor reaches the Function constructor to execute arbitrary code.
remediation: Remove the constructor.constructor reflection and invoke the intended function or value directly.
why: obj.constructor.constructor('...')() is the classic way to obtain Function and run a code string, bypassing eval bans and sandbox restrictions.
confidence: high
