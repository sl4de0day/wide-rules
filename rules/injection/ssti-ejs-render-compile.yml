id: wide/ssti-ejs-render-compile
name: ssti-ejs-render-compile
category: INJECTION
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-1336
pattern: \b[Ee]js\.(?:render|compile)\s*\(\s*(?:[^\s'"`)]|(?:'[^']*'|"[^"]*"|`[^`]*`)\s*\+|`[^`]*\$\{)
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Use ejs.renderFile with a fixed template path (or a constant string literal) and supply user input only as the data object, never build the template string from request input.
why: ejs.render/compile evaluate their string argument as an EJS template whose <% %> scriptlets are executed as JavaScript, so a dynamic source is direct server-side code injection.
confidence: high
