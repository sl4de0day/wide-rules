id: wide/ssti-handlebars-compile
name: ssti-handlebars-compile
category: INJECTION
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-1336
pattern: \b[Hh]andlebars\.(?:compile|precompile)\s*\(\s*(?:[^\s'"`)]|(?:'[^']*'|"[^"]*"|`[^`]*`)\s*\+|`[^`]*\$\{)
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Keep the template source a fixed string literal and pass user input only through the data/context object of the compiled function, never into compile() itself.
why: Handlebars.compile/precompile turns its string argument into an executable template function, so a dynamic template source lets an attacker inject template/helper expressions that can escalate to RCE via prototype access.
confidence: high
