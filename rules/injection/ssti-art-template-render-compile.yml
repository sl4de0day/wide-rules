id: wide/ssti-art-template-render-compile
name: ssti-art-template-render-compile
category: INJECTION
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-1336
pattern: \b(?:template|artTemplate)\.(?:render|compile)\s*\(\s*(?:[^\s'"`)]|(?:'[^']*'|"[^"]*"|`[^`]*`)\s*\+|`[^`]*\$\{)
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Use template() with a fixed template id/file path and pass user input as the data object; never call render/compile on a template string derived from user input.
why: art-template's render/compile turn the passed string into a JavaScript render function whose expression syntax executes JS, so a dynamic template source enables remote code execution.
confidence: high
