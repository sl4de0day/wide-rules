id: wide/ssti-fenom-compile-code
name: ssti-fenom-compile-code
category: INJECTION
severity: HIGH
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|#|\*)).*?->compileCode\s*\(\s*(?:\$|(?:'[^']*'|"[^"]*")\s*\.\s*[\$A-Za-z_]|"[^"]*\$\{?[A-Za-z_])
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Compile only fixed template strings (or use display()/fetch() with a template name) and pass user input as the template variables array, not as the compiled source.
why: Fenom's compileCode() compiles its first argument as Fenom template source into PHP, so a dynamic string allows template-expression injection and code execution.
confidence: high
