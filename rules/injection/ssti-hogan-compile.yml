id: wide/ssti-hogan-compile
name: ssti-hogan-compile
category: INJECTION
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-1336
pattern: \b[Hh]ogan\.compile\s*\(\s*(?:[^\s'"`)]|(?:'[^']*'|"[^"]*"|`[^`]*`)\s*\+|`[^`]*\$\{)
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Compile only fixed template literals and pass user input through the render data object; never derive the template string from user input.
why: Hogan.compile turns its string argument into a Mustache template function, so a user-controlled template string lets an attacker inject sections and partials that disclose context data and enable stored XSS.
confidence: high
