id: wide/ssti-commons-jexl-create-expression
name: ssti-commons-jexl-create-expression
category: INJECTION
severity: HIGH
languages:
  - java
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|\*)).*?\.\s*create(?:Expression|Script)\s*\(\s*(?:[A-Za-z_$]|(?:"[^"]*"|'[^']*')\s*(?:\+(?!\s*["'])|\.\s*(?:format|formatted)\s*\())
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Compile only fixed literal JEXL and pass user input as variables in the JexlContext; never build the expression string from user input.
why: JexlEngine.createExpression/createScript compiles its argument as a JEXL expression/script; a dynamic argument is attacker-controlled JEXL that can call arbitrary Java and reach RCE.
confidence: high
