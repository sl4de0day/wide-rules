id: wide/ssti-mustache-render-parse
name: ssti-mustache-render-parse
category: INJECTION
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-1336
pattern: \b[Mm]ustache\.(?:render|parse|to_html)\s*\(\s*(?:[^\s'"`)]|(?:'[^']*'|"[^"]*"|`[^`]*`)\s*\+|`[^`]*\$\{)
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Pass a fixed template literal as the first argument and put user input in the view object; never derive the template string from request input.
why: Mustache.render/parse interpret their first argument as the template, so a user-controlled template string lets an attacker inject Mustache sections and partials, leaking context data and enabling stored XSS.
confidence: high
