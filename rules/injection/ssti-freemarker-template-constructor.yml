id: wide/ssti-freemarker-template-constructor
name: ssti-freemarker-template-constructor
category: INJECTION
severity: HIGH
languages:
  - java
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|\*)).*?new\s+(?:[A-Za-z_$][\w$]*\s*\.\s*)*Template\b\s*\(\s*[^;,()]*,\s*(?!new\s+StringReader\s*\(\s*["'])(?:[A-Za-z_$]|(?:"[^"]*"|'[^']*')\s*(?:\+(?!\s*["'])|\.\s*(?:format|formatted)\s*\())
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Load templates by name from a TemplateLoader/Configuration and pass user input only as data in the data-model; never build the Template source String/Reader from user input.
why: The FreeMarker Template constructor compiles its second argument (a String source or a Reader over one) into an executable template, so a dynamic source lets an attacker inject FreeMarker directives that reach RCE.
confidence: high
