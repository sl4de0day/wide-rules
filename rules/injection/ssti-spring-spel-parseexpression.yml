id: wide/ssti-spring-spel-parseexpression
name: ssti-spring-spel-parseexpression
category: INJECTION
severity: HIGH
languages:
  - java
cwe: CWE-1336
pattern: ^(?!\s*(?:\/[/*]|\*)).*?\.\s*parseExpression\s*\(\s*(?:[A-Za-z_$]|(?:"[^"]*"|'[^']*')\s*(?:\+(?!\s*["'])|\.\s*(?:format|formatted)\s*\())
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Parse only fixed literal expressions and feed user input as variables/root object via EvaluationContext; never concatenate user input into the parsed expression.
why: ExpressionParser.parseExpression compiles its argument as a SpEL expression (often used as a template via TemplateParserContext); a dynamic expression string is arbitrary SpEL, e.g. T(java.lang.Runtime), and yields RCE.
confidence: high
