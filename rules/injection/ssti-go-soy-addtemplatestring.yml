id: wide/ssti-go-soy-addtemplatestring
name: ssti-go-soy-addtemplatestring
category: INJECTION
severity: MEDIUM
languages:
  - go
cwe: CWE-1336
pattern: ^(?!\s*(?:\/\/|\/\*|\*)).*\.AddTemplateString\(\s*[^,)]+,\s*(?:[A-Za-z_]|[\x22\x60][^\x22\x60]*[\x22\x60]\s*\+)
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Add templates from fixed literal strings or trusted files via AddTemplateFile, and pass user input only as the data map at render time.
why: soy Bundle/Tofu.AddTemplateString(name, contents) compiles its second argument as Closure Template SOURCE, so passing user input as the contents lets an attacker inject Soy commands and reach the render data.
confidence: high
