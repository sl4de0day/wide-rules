id: wide/ssti-dotliquid-template-parse
name: ssti-dotliquid-template-parse
category: INJECTION
severity: HIGH
languages:
  - cs
  - csx
cwe: CWE-1336
pattern: ^(?!\s*(?:\/\/|\/\*|\*)).*\bTemplate\.Parse\s*\(\s*(?:(?:\$@?|@\$)"|@?"[^"]*"\s*\+|[A-Za-z_][\w.]*\s*[\[(+,)])
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Parse only fixed literal Liquid templates and expose user input as registered drop/hash DATA passed to Render, never as the parsed source.
why: DotLiquid's Template.Parse compiles its argument as a Liquid template; a user-controlled source lets an attacker traverse the object graph and disclose or manipulate server data (SSTI).
confidence: high
