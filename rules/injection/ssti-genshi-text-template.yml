id: wide/ssti-genshi-text-template
name: ssti-genshi-text-template
category: INJECTION
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-1336
pattern: \b(?:New)?TextTemplate\s*\(\s*(?:(?!(?:filename|file|uri|lookup|name|encoding)\s*=)[A-Za-z_]\w*\s*=\s*)?(?:[rbuRBU]{0,2}f['"]|['"][^'"\n]*['"]\s*(?:\+|%|\.\s*format)|(?![rbufRBUF]{0,2}['"])[A-Za-z_][\w.]*(?![\w.])(?!\s*=[^=]))
message: Server-side template injection (SSTI) — user input is compiled as a template.
remediation: Build TextTemplate/NewTextTemplate from constant template text and provide user-controlled values only via the render context.
why: Genshi's TextTemplate/NewTextTemplate compile their argument as a text template containing evaluable Python expressions, so a dynamic source string lets user input execute as template directives.
confidence: high
