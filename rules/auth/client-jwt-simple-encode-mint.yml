id: wide/client-jwt-simple-encode-mint
name: client-jwt-simple-encode-mint
category: AUTH
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: \b(?:jwt|jwtSimple)\.encode\s*\(
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Perform jwt.encode() on the server and deliver the token to the client. Keep the shared secret in a server-only environment. On the client, request tokens rather than encoding them.
not-match: ^\s*(?:\/\/|\*|\/\*|<!--)
why: jwt-simple's jwt.encode(payload, secret) mints a signed JWT and needs the secret as its second argument. In a client-language file the secret is exposed in the bundle and tokens can be forged in the browser. Only decode (jwt.decode) is defensible client-side, and even that does not verify trust.
confidence: high
