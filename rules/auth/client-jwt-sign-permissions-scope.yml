id: wide/client-jwt-sign-permissions-scope
name: client-jwt-sign-permissions-scope
category: AUTH
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: \bjwt\.sign\s*\(\s*\{[^}]*['"]?\b(permissions|scopes?|roles|grants|entitlements|authorities)\b['"]?\s*:\s*[\['"]
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Issue scoped tokens server-side from the user's actual grants. The client should treat scopes as opaque and let the API authorize each request against server state.
not-match: ^\s*(\/\/|\*|\/\*)|\bjwt\.verify\b|server[-\s]side
why: A client-side jwt.sign() embeds a permissions/scopes/grants list into the token. Because the client holds the signing key and controls the payload, the user can grant themselves any scope. Entitlements must be decided by the server, not written into a token in the browser.
confidence: high
