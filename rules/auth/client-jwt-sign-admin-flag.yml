id: wide/client-jwt-sign-admin-flag
name: client-jwt-sign-admin-flag
category: AUTH
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: \bjwt\.sign\s*\(\s*\{[^}]*['"]?\b(isAdmin|is_admin|admin|isSuperAdmin|isSuperuser|superAdmin)\b['"]?\s*:\s*true\b
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Move token issuance to the server and set privilege flags from the authenticated user record. The client must never assemble or sign a token that grants itself elevated status.
not-match: ^\s*(\/\/|\*|\/\*)|\bjwt\.verify\b|server[-\s]side
why: 'A boolean privilege flag (isAdmin/admin: true) is baked into a token signed in the client. The user controls the payload and the key is exposed, so the flag is trivially forgeable — this is privilege escalation via a client-minted claim.'
confidence: high
