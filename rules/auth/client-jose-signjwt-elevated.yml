id: wide/client-jose-signjwt-elevated
name: client-jose-signjwt-elevated
category: AUTH
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: \bnew\s+SignJWT\s*\(\s*\{[^}]*['"]?\b(?:role['"]?\s*:\s*['"](?:admin|superadmin|root|owner)['"]|(?:isAdmin|admin|is_admin)['"]?\s*:\s*true\b|permissions['"]?\s*:\s*\[|scopes?['"]?\s*:\s*['"\[]|roles['"]?\s*:\s*\[)
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Sign JWTs only on the server with a server-held private key/secret, populating claims from the authenticated identity. In the browser use jose's jwtVerify against a public key for read-only checks, never SignJWT.
not-match: ^\s*(\/\/|\*|\/\*)|\bjwtVerify\b|\bjwt\.verify\b|server[-\s]side
why: jose's new SignJWT({...}) constructs a token payload with an elevated role/isAdmin/permissions claim and is being signed in client code. The key travels to the browser, so the elevated claim is forgeable by the user — a client-side authorization decision.
confidence: high
