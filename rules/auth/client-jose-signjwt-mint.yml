id: wide/client-jose-signjwt-mint
name: client-jose-signjwt-mint
category: AUTH
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: \bnew\s+SignJWT\s*\(
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Sign JWTs on the server with jose and return them to the client. On the client keep only jose's jwtVerify against a public key when strictly needed, or better, treat tokens as opaque. Do not ship the private/secret key to the browser.
not-match: ^\s*(?:\/\/|\*|\/\*|<!--)
why: jose's `new SignJWT(payload).sign(key)` builds and signs a JWT. Appearing in a client-language file means the signing key is present in the browser bundle and token minting is done client-side, making issued tokens forgeable. jose is legitimate server-side, so this rule is scoped to client languages.
confidence: high
