cwe: CWE-347
pattern: alg(?:orithm)?['"]?\s*(?::|={1,3})\s*['"]none['"]|algorithms?\s*[:=]\s*\[\s*['"]none['"]
message: A JWT is accepted with algorithm 'none'.
remediation: Pin a real algorithm (e.g. RS256/HS256) and never allow 'none'.
why: The 'none' algorithm means no signature, so anyone can forge a token the server will trust.
confidence: high
