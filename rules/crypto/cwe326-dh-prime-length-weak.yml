cwe: CWE-326
pattern: createDiffieHellman\s*\(\s*(?:\d{1,3}|1\d{3})\b
message: Diffie-Hellman group is created with a prime length below 2048 bits.
remediation: Pass a prime length of at least 2048 bits to createDiffieHellman().
why: A DH prime of 1024 bits or fewer can be broken with precomputation attacks (e.g. Logjam), exposing the shared secret and the whole session.
confidence: high
