id: wide/cwe915-orm-update-req-body
name: cwe915-orm-update-req-body
category: PROTOTYPE
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-915
pattern: \.(findByIdAndUpdate|findOneAndUpdate|updateOne|updateMany|replaceOne|findByIdAndReplace)\s*\(\s*[^,)]+,\s*req\.(?:body|query|params)\b
message: An update passes the raw request object as the update document.
remediation: 'Build the update from an explicit allowlist of fields, e.g. { $set: { name: req.body.name } }.'
why: The whole body is written to the matched record, so an attacker can add or overwrite protected fields (role, status, ownerId) in an existing entity (mass assignment).
confidence: high
