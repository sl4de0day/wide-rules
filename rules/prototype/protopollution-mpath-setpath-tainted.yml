id: wide/protopollution-mpath-setpath-tainted
name: protopollution-mpath-setpath-tainted
category: PROTOTYPE
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
cwe: CWE-1321
pattern: \bmpath\.(?:set|setValue)\s*\(\s*(?:req|request|body|params|query|payload|input|ctx|args|argv|headers|cookies|userInput|userData|userKey|userPath|clientData|untrusted|tainted|external|dynamicKey|dynamicPath)\b
message: Prototype pollution — attacker-controlled keys can reach Object.prototype via a recursive merge/set (CWE-1321).
remediation: Validate the path against an allowlist of schema fields before calling mpath.set, or reject any segment equal to __proto__/constructor/prototype; keep user-controlled dynamic keys out of the path argument entirely.
not-match: hasOwnProperty|Object\.create\(\s*null\s*\)|['"]__proto__['"]|['"]constructor['"]|['"]prototype['"]|isSafeKey|sanitizeKey|sanitizePath|validateKey|isValidKey|allowedKeys|allowlist|whitelist|denylist|blacklist|forbiddenKeys|dangerousKeys
why: 'mpath.set/setValue (used by mongoose internals) take the path as the FIRST argument: mpath.set(path, value, obj). A request-derived path such as ''__proto__.polluted'' walks and creates the prototype chain. AUDIT CHANGE: the taint keyword is anchored at the ROOT of that first argument, so it fires on mpath.set(req.body.path, ...) but NOT when only the VALUE is tainted (mpath.set(safePath, req.body.value, doc) / mpath.set(safePath, JSON.parse(req.body.data), doc)) and NOT on a benign leaf property (schema.query). Static string paths (''nested.path'') and the .get/.has reads never match; the guard notMatch suppresses magic-key / hasOwnProperty / allowlist checks.'
confidence: high
