id: wide/js-reflected-html-template-literal-text
name: js-reflected-html-template-literal-text
category: XSS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-79
pattern: '`(?:[^`]*[\s>"''=(,;:`}])?<[a-zA-Z][^`]*\$\{[^}]*req\.(?:query|body|params|cookies|headers)'
message: Reflected / context-mismatched XSS — user input reaches HTML or JS output without proper contextual encoding (CWE-79/116).
remediation: Escape the interpolated value for HTML text context (escapeHtml/he.encode) or sanitize with DOMPurify/sanitize-html; prefer an auto-escaping template engine over hand-built HTML template literals.
not-match: (?:^\s*(?:\/\/|\*)|escapeHtml|htmlEscape|escapeHTML|encodeHTML|sanitize|DOMPurify|\bhe\.encode|\bxss\(|\.replace\((?:\/|['"])[<>&])
why: A template-literal HTML string interpolates ${req.*} directly into element/text (or attribute) context with no encoding, so injected markup is reflected into the response -> reflected XSS. The tag-open must sit at the template start or follow a delimiter (whitespace/>/quote/}/etc.), which excludes TypeScript generics (Array<string>) and bare comparison operators that are not real tags.
confidence: high
