pattern: \$\([^)]*\)\.html\s*\(\s*[^)'"`]
message: jQuery .html() with a variable parses it as HTML.
remediation: Use .text() for text, or sanitise the HTML first.
why: Passing anything but a constant string to .html() turns markup in the value into live elements.
