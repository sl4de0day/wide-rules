id: wide/cwe400-ai-unbounded-agent-loop
name: ai-unbounded-agent-loop
category: AI_SECURITY
severity: MEDIUM
languages:
  - js
  - jsx
  - ts
  - tsx
  - py
  - mjs
  - cjs
cwe: CWE-400
pattern: \bwhile\s*\(\s*(?:true|1|!done|!finished|!settled)\s*\)\s*\{(?![^}]*\b(?:maxRounds|maxSteps|maxIterations|round\s*>=|step\s*>=)\b)[^}]*(?:agent|runner|llm)\.(?:step|run|complete|executeTurn)\s*\(
message: Autonomous agent execution loop lacks explicit termination boundary or maximum step limit.
remediation: Enforce a strict step threshold and use CommitmentGate to prevent runaway agent execution loops.
why: Unbounded agent loops can cause denial of service, resource exhaustion, and infinite tool flapping.
instruction: Always respect maximum step thresholds and loop termination boundaries.
confidence: medium
tests:
  positive:
    - "while (true) { agent.step(); }"
    - "while (!done) { runner.executeTurn(); }"
  negative:
    - "while (!done) { if (step >= maxSteps) break; agent.step(); }"
