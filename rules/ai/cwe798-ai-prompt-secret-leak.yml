id: wide/cwe798-ai-prompt-secret-leak
name: ai-prompt-secret-leak
category: AI_SECURITY
severity: HIGH
languages:
  - js
  - jsx
  - ts
  - tsx
  - py
  - mjs
  - cjs
cwe: CWE-798
pattern: \b(?:systemPrompt|system_prompt|instructions)\s*[:=].*(?:apiKey|api_key|password|secret|auth_token|token)\b
message: Hardcoded API key or secret embedded in AI agent system prompt.
remediation: Keep secrets outside LLM context and use server-side authenticated tools instead.
why: System instructions can be leaked to end users via prompt extraction or adversarial jailbreak prompts.
confidence: high
