id: wide/cwe798-ai-prompt-secret-leak
name: ai-prompt-secret-leak
category: AI_SECURITY
severity: HIGH
languages:
  - js
  - jsx
  - ts
  - tsx
  - py
  - mjs
  - cjs
cwe: CWE-798
pattern: \b(?:systemPrompt|systemMessage|system_prompt|instructions)\s*[:=].*?(?:process\.env\.(?:[A-Z_]*(?:KEY|SECRET|TOKEN|PASSWORD|PASS|AUTH))|apiKey|api_key|password|secret|auth_token|token)\b
message: Sensitive secrets or private API credentials embedded in prompt context.
remediation: Keep secrets outside LLM context and provide secrets through isolated backend proxy channels.
why: System instructions can be leaked to end users via prompt extraction or adversarial jailbreak prompts.
instruction: Never include secrets, API keys, private tokens, or credentials in prompt context or output.
confidence: high
tests:
  positive:
    - "const systemPrompt = `You act using key ${process.env.OPENAI_API_KEY}`;"
    - "system_prompt = f'token={auth_token}'"
  negative:
    - "const systemPrompt = 'Analyze the code safely without exposing credentials.';"
