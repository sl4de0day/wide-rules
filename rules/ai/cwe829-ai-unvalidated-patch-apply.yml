id: wide/cwe829-ai-unvalidated-patch-apply
name: ai-unvalidated-patch-apply
category: AI_SECURITY
severity: MEDIUM
languages:
  - js
  - jsx
  - ts
  - tsx
  - py
  - mjs
  - cjs
cwe: CWE-829
pattern: \b(?:applyPatch|applyDiff|fs\.writeFile|writeFileSync)\s*\(\s*(?:filepath|path|file)\s*,\s*(?:patch|suggestion|aiOutput|response\.content)\s*\)
message: Direct file write of AI-suggested code diff without validation or syntax check.
remediation: Score candidate patches using WeightedScorer and validate syntax before committing changes.
why: Applying unvalidated code patches directly to disk can corrupt project files or introduce syntax errors.
confidence: medium
