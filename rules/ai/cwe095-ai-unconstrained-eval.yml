id: wide/cwe095-ai-unconstrained-eval
name: ai-unconstrained-eval
category: AI_SECURITY
severity: CRITICAL
languages:
  - js
  - jsx
  - ts
  - tsx
  - py
  - mjs
  - cjs
cwe: CWE-95
pattern: \b(?:eval|Function)\s*\(\s*(?:(?:model|ai|agent|llm)Response|suggestedCode|candidatePatch|toolArgs)
message: Direct evaluation of AI-generated code via eval or Function constructor.
remediation: Execute generated code in a sandboxed process or parse into an AST for safety analysis before execution.
why: Evaluating unconstrained code generated by an LLM allows untrusted arbitrary code execution within the host runtime.
confidence: high
