id: wide/cwe095-ai-unconstrained-eval
name: ai-unconstrained-eval
category: AI_SECURITY
severity: CRITICAL
languages:
  - js
  - jsx
  - ts
  - tsx
  - py
  - mjs
  - cjs
cwe: CWE-95
pattern: \b(?:eval|Function|vm\.runInContext|compile)\s*\(\s*(?:(?:model|ai|agent|llm)Response|suggestedCode|candidatePatch|toolArgs|toolOutput|tool_output|response\.text|aiResult|ai_output|completion)\b
message: Evaluating raw executable code returned by LLM without sandboxing or static verification.
remediation: Parse responses into structured abstract syntax trees or validate against a strict AST schema before execution.
why: Evaluating unconstrained code generated by an LLM allows untrusted arbitrary code execution within the host runtime.
instruction: Never evaluate raw executable code dynamically without AST schema validation or sandboxing.
confidence: high
tests:
  positive:
    - "eval(modelResponse);"
    - "vm.runInContext(toolOutput, ctx);"
  negative:
    - "JSON.parse(modelResponse);"
