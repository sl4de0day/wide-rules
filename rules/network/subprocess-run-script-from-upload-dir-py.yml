id: wide/subprocess-run-script-from-upload-dir-py
name: subprocess-run-script-from-upload-dir-py
category: NETWORK
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-829
pattern: subprocess\.(?:run|call|Popen|check_output|check_call|getoutput)\s*\(.*(?:\/tmp\/|\btmpdir\b|\btmp_[A-Za-z]|(?:upload|UPLOAD)[A-Za-z_]*(?:_?[Dd]ir|_?[Pp]ath|_DIR|_PATH|_script)|writable(?:_dir|Dir|_path))
message: Write-then-execute — code is loaded or run from a user-controlled or writable path (potential RCE, CWE-829/95/98/94).
remediation: Execute only interpreters/scripts from a fixed, non-writable directory; never pass an uploads/tmp path as the program or first argument, and validate any dynamic component against an allow-list.
not-match: ^\s*#
why: Spawning an interpreter or script whose path is built from an uploads/tmp/writable *directory variable* executes whatever an attacker managed to write there; the file-write primitive becomes code execution via the child process. The keyword set was tightened from bare 'upload'/'writable' (which fired on benign literal filenames like 'upload_report.py' and on 'uploads/' data args to rsync/tar) to variable-shaped tokens (upload*_dir/_path/_DIR/_PATH/_script, tmpdir, tmp_*, /tmp/, writable_dir), so a data-path argument in a quoted literal no longer floods.
confidence: high
