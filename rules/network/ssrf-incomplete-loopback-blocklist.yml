pattern: (?:\[|asList\s*\(|array\s*\()[^\]\)\n]*(?:127\.0\.0\.1|localhost|0\.0\.0\.0|::1)[^\]\)\n]*[\]\)]+\s*\.\s*(?:includes|include\?|indexOf|some|contains|has)\s*\([^)\n]*\bhost|\bhost(?:name)?\b[^\n]*\bin\s*[\[\(][^\]\)\n]*(?:127\.0\.0\.1|localhost|0\.0\.0\.0)|in_array\s*\([^)\n]*\bhost[^)\n]*(?:127\.0\.0\.1|localhost|0\.0\.0\.0)|\bhost(?:name)?\b\s*===?\s*['"](?:127\.0\.0\.1|localhost|0\.0\.0\.0|::1)['"]|\bhost[\w.]*\.equals\s*\(\s*['"](?:127\.0\.0\.1|localhost|0\.0\.0\.0)['"]
message: Incomplete SSRF loopback blocklist — misses cloud-metadata IP, IPv6, and alternate IP encodings (CWE-918).
remediation: Do not enumerate a denylist of loopback strings. After DNS resolution, resolve the hostname to its IP(s) and reject any address in a private/reserved range (RFC1918, 127.0.0.0/8, ::1, 169.254.0.0/16 link-local incl. 169.254.169.254, fc00::/7, 0.0.0.0/8) with a numeric IP-range check, normalizing alternate encodings first. Prefer a vetted SSRF-guard library and validate the final resolved address, pinning the resolved IP for the actual connection to defeat DNS-rebind.
not-match: \bhost(?:name)?\b\s*!==?|\bnot\s+in\b|!\s*\[|!\s*in_array|!\s*[\w.]*\.(?:includes|include\?|contains|equals)|!\s*asList|!\s*Arrays|169\.254|\.(?:listen|bind)\s*\(|^\s*(?:\/\/|#|\*|\/\*|<!--)
why: 'A positive-match-to-deny host check that blocks only a handful of loopback literals (127.0.0.1 / localhost / 0.0.0.0 / ::1) via array membership (.includes/.indexOf/.some/.has/.contains, in_array, Python `in [..]`) or an equality chain (hostname===literal, host.equals(literal)) is an SSRF blocklist with a hole: it never denies the cloud-metadata endpoint 169.254.169.254, and typically misses alternate loopback encodings (decimal 2130706433, hex 0x7f000001, octal 0177.0.0.1, IPv6 [::1]). An attacker supplies any of those forms and the request sails past the guard to internal/metadata services.'
confidence: high
