id: wide/ssrf-imgkit-python-from-user
name: ssrf-imgkit-python-from-user
category: NETWORK
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-918
pattern: \bimgkit\.from_(?:string|url|file)\s*\(
message: Renderer resource embedding — a document/PDF/image converter resolves a user-controlled resource, enabling LFI or SSRF (CWE-918/73/611).
remediation: 'Pass options={''disable-local-file-access'': None}, never set enable-local-file-access, and allowlist remote URLs; only render fixed/trusted sources.'
not-match: (?:^\s*(?:#|\/\/|\*)|disable-local-file-access|imgkit\.from_(?:string|url|file)\s*\(\s*['"`][^'"`$]*['"`]\s*[,)])
why: python imgkit (wkhtmltoimage wrapper) rendering user-controlled HTML/URL to an image; default local-file access allows file:// disclosure and internal URL fetches (SSRF) inside the converted document.
confidence: high
