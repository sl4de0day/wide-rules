id: wide/cred-ruby-fasthash-password-storage
name: cred-ruby-fasthash-password-storage
category: SECRETS
severity: HIGH
languages:
  - rb
cwe: CWE-916
pattern: Digest::(?:MD5|SHA1|SHA256|SHA512|SHA2)\.(?:hexdigest|digest|base64digest)\(?[^)\n]*(?:password|passwd|pwd|passphrase)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Use BCrypt::Password.create(password) (or has_secure_password in Rails / argon2 gem) for storage and BCrypt::Password.new(hash).is_password?(pw) to verify.
not-match: BCrypt|bcrypt|Argon2|scrypt|PBKDF2|has_secure_password|checksum|etag|\bcache|fingerprint|integrity|redact|\bmask|is_password\?|^\s*#
why: Digest::MD5/SHA1/SHA256.hexdigest(password) stores a password behind a fast unsalted digest. The credential token requires a trailing \b, so Digest::MD5.hexdigest(password_reset_token) is not flagged. BCrypt, Rails has_secure_password, verify (is_password?) and non-credential checksums are excluded.
confidence: high
