cwe: CWE-200
pattern: ^(?=.*(?:\.(?:json|jsonp|send)\s*\(|jsonify\s*\(|gin\.H|render\s+json|->json\s*\(|JsonResponse|JsonResult|c\.JSON|return\s+Json|res\.write))(?=.*\b(?:password|passwd|pwd|client_secret|session_secret|credit_?card|card_?number|cvv|ssn|social_?security|bank_?account|routing_?number)\b).*$
message: GraphQL/dev misconfiguration — introspection or a dev endpoint exposed, or a weak/predictable secret (CWE-200/489/307/770/330).
remediation: Strip these fields from the serialized object; expose only non-sensitive identifiers, or masked/last-4 forms. Store passwords only as salted hashes and never return them.
not-match: ^\s*(?:\/\/|#|\*|\/\*|<!--)|NODE_ENV|isAdmin|is_admin|requireAdmin|admin_required|@admin|hashed|passwordHash|password_hash|_hash\b|\bhash\b|bcrypt|scrypt|argon2?|pbkdf2|\bredact\w*|\bmask\w*|\*{3,}|X{4,}|:\s*(?:null|undefined|None|nil|''|""|0|false)\b|=\s*(?:null|None|nil|''|"")|hasPassword|has_password|!!|last_?4|lastFour|select:\s*false
why: Serializing a raw password, card number, CVV, SSN, or bank/routing detail into a response leaks credentials and regulated PII to the client and any logs/proxies in between. Word boundaries keep 'passwordChangedAt', 'passwordLastChanged', 'cardLast4', 'ssnLast4' from firing; suppressed when hashed, masked, redacted, boolean-ized (!!/hasPassword), or null.
confidence: high
