id: wide/role-session-file-keyed-by-user-js
name: role-session-file-keyed-by-user-js
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-807
pattern: \b(readFileSync|readFile|writeFileSync|writeFile|appendFileSync|appendFile)\s*\(\s*[^,;)]*(session|role|auth|acl|perm|priv|grant)[^,;)]*(\+|\$\{)\s*[^,;)]*\b(user(?:_?[Nn]ame|_?[Ii]d)?|uid)\b
message: Broken session management — identity/role from an unverified client value or a writable store (CWE-807/302).
remediation: Key session/role files by a random server-issued session id (CSPRNG), not by a username, and derive the id from verified state (req.session, a verified token).
not-match: req\.session\.|signedCookies|jwt\.verify|^\s*(\/\/|\*|\/\*)
why: 'Authorization/session state is read from or written to a file whose path is built (concat/template) from a client-controlled username. A writable, user-keyed role/session file lets an attacker read or overwrite another user''s privilege state. Fixed a real gap: the original tail matched userId but not camelCase userName/user_name; rewrote the tail to user(?:_?[Nn]ame|_?[Ii]d)? so all of user, userName, user_name, userId, user_id, uid fire. path.join(...) and CSPRNG/session-id keys are excluded.'
confidence: high
