id: wide/env-fallback-secret-py
name: env-fallback-secret-py
category: SECRETS
severity: CRITICAL
languages:
  - py
  - pyi
  - pyw
cwe: CWE-798
pattern: os\.(?:environ\.get|getenv)\s*\(\s*['"]\w*(?:SECRET|PASSWORD|PASSWD|API_?KEY|APIKEY|ACCESS_?KEY|TOKEN|PRIVATE_?KEY|SIGNING_?KEY|ADMIN_?KEY|MASTER_?KEY|ROOT_?KEY|ENCRYPT|CIPHER|AUTH|SALT|JWT|CREDENTIAL|CLIENT_SECRET|_PASS|PASSPHRASE)\w*['"]\s*,\s*['"][^'"\n]{4,}['"]
message: Hardcoded fallback secret — a secret read from the environment with a committed default value (process.env.X || 'literal') (CWE-798).
remediation: Drop the default and fail fast when the secret is missing (raise at startup); load secrets only from the environment or a secrets manager.
not-match: ^\s*#|['\"](?:changeme|change[_-]?me|your[_-]|example|placeholder|dummy|xxx+|todo|fixme|none|null|localhost|development|dev|test)['\"]
why: A secret is read from the environment with a hardcoded string default (os.getenv('X', 'literal') / os.environ.get('X', 'literal')). When the var is unset the app uses that baked-in default — a committed, predictable credential.
confidence: high
