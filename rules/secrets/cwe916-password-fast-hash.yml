id: wide/cwe916-password-fast-hash
name: cwe916-password-fast-hash
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-916
pattern: createHash\s*\([^)]*\)\s*\.update\s*\([^)]*(?:passw(?:ord|d)|passphrase|pwd)
message: A password is hashed with a plain fast digest (createHash) instead of a password KDF.
remediation: Hash passwords with bcrypt, scrypt, or argon2, which are deliberately slow and salted.
why: General-purpose hashes like SHA-256/MD5 are extremely fast, so leaked password hashes can be brute-forced at billions of guesses per second.
confidence: high
