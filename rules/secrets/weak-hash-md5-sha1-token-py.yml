id: wide/weak-hash-md5-sha1-token-py
name: weak-hash-md5-sha1-token-py
category: SECRETS
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-330
pattern: \b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|access(?:_?token)?|token|reset(?:_?token|_?key|_?code|_?hash)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*=\s*.{0,40}?hashlib\.(?:md5|sha1)\s*\(
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Generate the identifier with secrets.token_urlsafe/token_hex or os.urandom; do not hash user-known data with md5/sha1 to make a token.
not-match: ^\s*#|secrets\.|os\.urandom|token_hex|token_urlsafe|token_bytes|SystemRandom
why: A security token produced by hashlib.md5/sha1 over a known value (username, email, user id, timestamp) is predictable because the input is guessable and the hash adds no secrecy; the attacker recomputes it.
confidence: high
