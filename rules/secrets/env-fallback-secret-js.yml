id: wide/env-fallback-secret-js
name: env-fallback-secret-js
category: SECRETS
severity: CRITICAL
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-798
pattern: process\.env(?:\.\w*(?:SECRET|PASSWORD|PASSWD|API_?KEY|APIKEY|ACCESS_?KEY|TOKEN|PRIVATE_?KEY|SIGNING_?KEY|ADMIN_?KEY|MASTER_?KEY|ROOT_?KEY|ENCRYPT|CIPHER|AUTH|SALT|JWT|CREDENTIAL|CLIENT_SECRET|_PASS|PASSPHRASE)\w*|\[\s*['"]\w*(?:SECRET|PASSWORD|PASSWD|API_?KEY|APIKEY|ACCESS_?KEY|TOKEN|PRIVATE_?KEY|SIGNING_?KEY|ADMIN_?KEY|MASTER_?KEY|ROOT_?KEY|ENCRYPT|CIPHER|AUTH|SALT|JWT|CREDENTIAL|CLIENT_SECRET|_PASS|PASSPHRASE)\w*['"]\s*\])\s*(?:\|\||\?\?)\s*['"`][^'"`\n]{4,}['"`]
message: Hardcoded fallback secret — a secret read from the environment with a committed default value (process.env.X || 'literal') (CWE-798).
remediation: Remove the fallback. Fail fast when the secret is missing (throw at startup) and load it only from the environment or a secrets manager; never commit a default credential.
not-match: ^\s*(?:\/\/|\*|\/\*)|['\"`](?:changeme|change[_-]?me|your[_-]|example|placeholder|dummy|xxx+|todo|fixme|none|null|undefined|localhost|127\.0\.0\.1|development|dev|test|staging)['\"`]|\|\|\s*['\"`]['\"`]
why: A secret (admin key, signing key, API key, password) is read from the environment with a hardcoded string FALLBACK (process.env.X || 'literal'). When the env var is unset the app silently uses that literal — a secret baked into source (and version control), and a predictable default anyone reading the code can use.
confidence: high
