id: wide/client-jsonwebtoken-import
name: client-jsonwebtoken-import
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: (?:\brequire\s*\(\s*|\bimport\s*\(\s*|\bfrom\s+)['"]jsonwebtoken['"]
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Remove the jsonwebtoken import from client code. If you only need to read claims, use 'jwt-decode' (decode-only, no secret). Perform all signing/verification server-side.
not-match: ^\s*(?:\/\/|\*|\/\*|<!--)
why: Importing the 'jsonwebtoken' package into a client-language file pulls a server signing library into the browser bundle. Its sign() path needs the secret, so the presence of this import in front-end code is a strong signal that a signing secret is (or will be) shipped to clients. Browsers should use jwt-decode for read-only needs, not jsonwebtoken.
confidence: high
