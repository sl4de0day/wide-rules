id: wide/cred-node-password-to-log
name: cred-node-password-to-log
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-532
pattern: (?:console\.(?:log|info|debug|warn|error|trace)|(?:logger|log|winston|pino|bunyan)\.(?:log|info|debug|warn|error|trace|verbose|silly))\(\s*(?:[^)]*?(?:[,{(]|\+|\$\{|:)\s*)?[\w$.]*(?:password|passwd|pwd|passphrase|secret|api_?key|apikey|access_?token|refresh_?token|client_?secret|credentials?|creds)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Never log credential values. Remove the field or log a redacted placeholder ('***'); configure a logger serializer/redaction paths for password/secret/token.
not-match: redact|\bmask(?:ed)?\b|\*\*\*|xxxx|\bhash|\.length\b|sanitiz|scrub|\[redacted\]|^\s*\/\/
why: A console/logger call emits a password/secret VALUE (a bare, member-access, or interpolated password-named identifier), so the plaintext credential is persisted to log sinks. The member prefix is now [\w$.]* (multi-segment) so console.log(req.body.password) is caught; the trailing \b keeps passwordResetToken/passwordPolicy out. String literals that merely mention the word, .length, and redacted values are excluded.
confidence: high
