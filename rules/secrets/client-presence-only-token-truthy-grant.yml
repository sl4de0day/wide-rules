id: wide/client-presence-only-token-truthy-grant
name: client-presence-only-token-truthy-grant
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-287
pattern: \bif\s*\(\s*(?:token|authToken|accessToken|jwtToken|bearer(?:Token)?|sessionToken|apiKey|apikey|authHeader)\s*\)\s*\{?\s*(?:return\s+)?(?:next\s*\(\s*\)|allow\w*\s*\(|authorize\w*\s*\(|grant\w*\s*\(|req\.user\s*=|ctx\.state\.user\s*=|res\.locals\.user\s*=)
message: Broken access control — a security decision made from a client value, unverified identifier, or unauthenticated service.
remediation: 'Verify the token before granting: const payload = jwt.verify(token, key) (or verifyToken/passport), and only then set req.user/call next(). Treat a decode failure the same as a missing token.'
not-match: (?:jwt\.verify|\.verify\(|jwtVerify|verifyToken|verifyJwt|verifyIdToken|verifyAsync|validateToken|passport\.authenticate|introspect|^\s*\/\/|^\s*\*|^\s*\/\*)
why: The middleware calls next()/authorize()/sets req.user whenever a token variable is truthy, with no decode-and-verify on the guard. Any attacker-supplied string is a truthy token, so the request is treated as authenticated without the signature or claims ever being checked.
confidence: high
