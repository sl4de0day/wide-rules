id: wide/weak-hash-md5-sha1-token-js
name: weak-hash-md5-sha1-token-js
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-330
pattern: \b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|access(?:_?token)?|token|reset(?:_?token|_?key|_?code|_?hash)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*[:=]\s*.{0,40}?(?:createHash\(\s*['"](?:md5|sha1)['"]|\b(?:md5|sha1)\s*\()
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Generate the identifier from a CSPRNG (crypto.randomBytes(32).toString('hex') or crypto.randomUUID()); never derive a security token by hashing user-known or observable data with md5/sha1.
not-match: ^\s*(?:\/\/|\*|\/\*|#|<!--)|\brandom|createHash\(\s*['"]sha(?:256|384|512)
why: 'A session id or token built by md5/sha1-hashing a known or low-entropy value (username, email, IP, timestamp) is fully predictable: the hash adds no entropy, so an attacker who knows the inputs can recompute the token and hijack the session or forge a reset link.'
confidence: high
