id: wide/time-as-session-token-py
name: time-as-session-token-py
category: SECRETS
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-340
pattern: \b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|access(?:_?token)?|token|reset(?:_?token|_?key|_?code|_?hash)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*=\s*.{0,60}?(?:time\.time\s*\(\s*\)|datetime\.(?:now|utcnow)\s*\(\s*\))
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use the secrets module (secrets.token_urlsafe / secrets.token_hex) or os.urandom for security identifiers; a timestamp may be stored as expiry metadata but not used as the token value.
not-match: ^\s*#|secrets\.|os\.urandom|token_hex|token_urlsafe|token_bytes|SystemRandom|expir|max_age|\bttl\b
why: Deriving a token or session id from time.time() / datetime.now() (even hashed) yields a value bounded by a small, guessable range of timestamps, so it can be brute-forced to hijack a session or forge a reset key.
confidence: high
