id: wide/cwe470-reflect-get-window-dynamic-key
name: cwe470-reflect-get-window-dynamic-key
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
cwe: CWE-470
pattern: Reflect\.get\s*\(\s*(?:window|globalThis|self|top)\s*,
message: Reflect.get reads a global-object property using a non-literal (dynamic) key.
remediation: Resolve the value through an explicit allowlist/lookup map keyed by validated input rather than indexing window/globalThis with untrusted names.
not-match: Reflect\.get\s*\([^,]*,\s*["']
why: 'Looking up a global by an attacker-controlled name is unsafe reflection: it can reach dangerous globals (eval, Function, fetch) and, when the result is then called, leads to arbitrary code or capability abuse.'
confidence: high
