id: wide/cwe321-hardcoded-crypto-key
name: cwe321-hardcoded-crypto-key
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-321
pattern: create(?:Cipheriv|Hmac)\s*\(\s*['"][^'"]+['"]\s*,\s*['"]
message: A hardcoded string-literal key is passed to createCipheriv/createHmac.
remediation: Load the key from a secret manager or environment variable, never a literal in code.
why: An embedded cryptographic key is visible to anyone with the source or bundle and cannot be rotated, so a single leak compromises all data protected by it.
confidence: high
