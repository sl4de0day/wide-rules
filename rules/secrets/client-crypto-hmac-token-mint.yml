id: wide/client-crypto-hmac-token-mint
name: client-crypto-hmac-token-mint
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: \bcrypto\.createHmac\s*\(
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Compute HMAC signatures on the server and return the result, or verify inbound HMACs server-side. Keep the HMAC key in server-only environment config. If the client needs an unkeyed digest, use crypto.createHash (no secret) instead.
not-match: ^\s*(?:\/\/|\*|\/\*|<!--)
why: crypto.createHmac(alg, secret) keys an HMAC with a shared secret to build a signature/token. In a client-language file that secret is embedded in the bundle, so any attacker can recompute valid HMAC tokens/signatures and forge authenticated requests. Keyed MACs are only meaningful when the key stays server-side.
confidence: high
