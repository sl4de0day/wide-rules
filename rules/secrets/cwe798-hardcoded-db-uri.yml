id: wide/cwe798-hardcoded-db-uri
name: cwe798-hardcoded-db-uri
category: SECRETS
severity: CRITICAL
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - py
  - pyi
  - pyw
  - go
  - java
  - cs
  - rb
  - php
  - yml
  - yaml
  - json
cwe: CWE-798
pattern: '(?:postgres(?:ql)?|mysql2?|mongodb(?:\+srv)?|rediss?):\/\/[A-Za-z0-9._-]{1,40}:[^\s''"`${}<>@]{4,64}@[A-Za-z0-9._-]{2,80}'
not-match: (?:example|changeme|placeholder|your[_-]?(?:pass|password|secret)|@(?:localhost|127\.0\.0\.1)\b|\$\{|\{\{)
confidence: high
message: Hardcoded database connection URI containing inline credentials detected.
why: Embedding database usernames and passwords directly in source code or checked-in configs exposes backend data stores to anyone with repository or artifact access.
remediation: Load connection strings from environment variables or an OS/cloud secret manager (e.g., process.env.DATABASE_URL or Keychain/DPAPI vault) instead of hardcoding credentials.
tests:
  positive:
    - 'const uri = "postgresql://prod_admin:S3cur3ProdPass99@db.internal.company.com:5432/billing";'
    - 'MONGO_URI = "mongodb+srv://appuser:k9X_prodToken21@cluster0.mongodb.net/app"'
  negative:
    - 'const uri = `postgresql://${process.env.DB_USER}:${process.env.DB_PASS}@db.internal:5432/billing`;'
    - 'const dev = "postgres://dev:devpass@localhost:5432/local_db";'
    - 'const doc = "postgresql://user:changeme@db.example.com:5432/app";'
