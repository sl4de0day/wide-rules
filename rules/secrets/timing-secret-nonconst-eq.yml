pattern: (?:\bsig\b|\bmac\b|[\w$]*(?:token|api_?key|secret|passwd|password|hmac|signature|digest|csrf|otp)(?:key|hash|value|bytes|buffer|digest|header|hex|str)?(?![\w$]))\s*(?:===?|!==?|\.equals\s*\()|(?:===?|!==?)\s*(?:\bsig\b|\bmac\b|[\w$]*(?:token|api_?key|secret|passwd|password|hmac|signature|digest|csrf|otp)(?:key|hash|value|bytes|buffer|digest|header|hex|str)?(?![\w$])(?!\s*\.\s*length))
message: Non-constant-time secret comparison — compare secrets with crypto.timingSafeEqual, not == / === (CWE-208).
remediation: 'Compare secrets with a constant-time function: Node crypto.timingSafeEqual(Buffer.from(a), Buffer.from(b)) (guard equal length first), Python hmac.compare_digest(a,b), PHP hash_equals($known,$user), Java MessageDigest.isEqual(a,b), Go subtle.ConstantTimeCompare(a,b)==1, Rails ActiveSupport::SecurityUtils.secure_compare(a,b). Never use ==/===/.equals on secrets.'
not-match: (?:timingsafeequal|compare_digest|hash_equals|isequal|constanttimecompare|constanttimeequals|secure_compare)\s*\(|(?:===?|!==?)\s*(?:(?:null|undefined|true|false|nan|none|nil)\b|-?\d+(?:\.\d+)?|['"`])|['"`]\s*(?:===?|!==?)|(?:null|undefined|true|false|nan|none|nil)\b\s*(?:===?|!==?)|(?:file|method|type|schema|func|function|byte|content|call|api)Signature|new RegExp\(|message:\s*['"]|\bwhy:|\bfix:|\bsinkRegex\b|text:\s*new
why: A secret (token, apiKey, password, hmac, signature, sig, mac, digest, csrf, otp) is compared with ==/===/!=/!== or String.equals, which short-circuits on the first differing byte. The time-to-answer leaks how many leading bytes matched, letting an attacker recover the secret byte-by-byte. The fix is a length-independent constant-time comparator.
confidence: high
