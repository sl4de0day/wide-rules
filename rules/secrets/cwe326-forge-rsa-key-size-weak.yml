id: wide/cwe326-forge-rsa-key-size-weak
name: cwe326-forge-rsa-key-size-weak
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-326
pattern: generateKeyPair[\s\S]*?\bbits\s*[:=]\s*(?:\d{1,3}|1\d{3})\b
message: An RSA key pair is generated with fewer than 2048 bits.
remediation: Generate at least 2048-bit (preferably 3072-bit) RSA keys.
why: Libraries such as node-forge take a `bits` option; 1024-bit and smaller RSA keys are factorable and let an attacker recover the private key.
confidence: high
