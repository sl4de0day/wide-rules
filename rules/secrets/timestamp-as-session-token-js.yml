id: wide/timestamp-as-session-token-js
name: timestamp-as-session-token-js
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-340
pattern: \b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|access(?:_?token)?|token|reset(?:_?token|_?key|_?code|_?hash)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*[:=]\s*.{0,40}?(?:Date\.now\s*\(\s*\)|new\s+Date\s*\([^)]*\)\s*\.\s*getTime\s*\(\s*\))
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use crypto.randomUUID() or crypto.randomBytes(...) for the identifier; a timestamp may accompany a token as metadata (expiry) but must never be the token's value.
not-match: ^\s*(?:\/\/|\*|\/\*|#)|\brandom|expir|maxAge|max_age|\bttl\b|timeout|lastSeen|updatedAt|createdAt
why: 'Using Date.now() / new Date().getTime() as the value of a token or session id makes it guessable: timestamps are low-entropy and observable, so an attacker can brute-force the small window of millisecond values to recover a valid identifier.'
confidence: high
