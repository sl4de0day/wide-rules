id: wide/cred-go-fasthash-password-storage
name: cred-go-fasthash-password-storage
category: SECRETS
severity: HIGH
languages:
  - go
cwe: CWE-916
pattern: \b(?:md5|sha1|sha256|sha512)\.(?:Sum|Sum256|Sum512)\([^)]*(?:password|passwd|pwd|passphrase)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Use golang.org/x/crypto/bcrypt.GenerateFromPassword, or argon2.IDKey / scrypt.Key with a random salt. Never store an md5/sha digest of a password.
not-match: bcrypt|argon2|scrypt|pbkdf2|GenerateFromPassword|hmac\.|checksum|etag|\bcache|fingerprint|integrity|redact|\bmask|^\s*\/\/
why: md5.Sum / sha1.Sum / sha256.Sum256([]byte(password)) stores a password behind a fast unsalted digest. The credential token requires a trailing \b, so md5.Sum([]byte(passwordResetToken)) and passwordDigest (already-hashed) are not flagged. golang.org/x/crypto/bcrypt, argon2, scrypt and non-credential checksums are excluded.
confidence: high
