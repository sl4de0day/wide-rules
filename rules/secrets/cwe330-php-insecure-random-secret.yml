id: wide/cwe330-php-insecure-random-secret
name: cwe330-php-insecure-random-secret
category: SECRETS
severity: MEDIUM
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
cwe: CWE-330
pattern: \b(?:token|password|passwd|salt|nonce|otp|secret|sessionid|session_id|api_?key|csrf|iv)\s*=[^=].*\b(?:mt_rand|rand|uniqid|lcg_value|mt_srand|srand)\s*\(
message: A security value (token/password/salt/IV/etc.) is generated with PHP's non-cryptographic rand/mt_rand/uniqid.
remediation: Use random_bytes()/random_int() (e.g. bin2hex(random_bytes(16))) for any security-sensitive value.
why: rand, mt_rand and uniqid are predictable and not cryptographically secure, so secrets derived from them can be guessed or reproduced by an attacker.
confidence: high
