id: wide/client-jose-textencoder-hardcoded-secret
name: client-jose-textencoder-hardcoded-secret
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-321
pattern: (?:\b(?:secret[_-]?key|signing[_-]?key|signing[_-]?secret|jwt[_-]?secret|hmac[_-]?key|hmac[_-]?secret|encoded[_-]?secret|secret|key)\b\s*=\s*|\.sign\s*\(\s*)new\s+TextEncoder\(\)\.encode\(\s*(['"`])[^'"`\r\n]{3,}\1
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Sign on the server with a key loaded from a secret store; return signed tokens to the client. If client-side verification is genuinely required, distribute only a public key (importSPKI/JWK) and use an asymmetric algorithm — never encode a shared secret into the bundle.
not-match: changeme|change[_-]?me|your[-_ ]?(?:secret|key|token|hmac|password)|example|placeholder|sample|dummy|foobar|todo|xxxx?|<[^>\r\n]+>|\$\{|process\.env
why: The jose idiom new TextEncoder().encode('literal') builds a symmetric secret key from a hardcoded string, either assigned to a secret/key variable or passed straight into .sign(). Bundled to the client, that byte key is fully recoverable and every JWS/JWT it signs is forgeable.
confidence: high
