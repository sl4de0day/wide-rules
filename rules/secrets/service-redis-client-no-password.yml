id: wide/service-redis-client-no-password
name: service-redis-client-no-password
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - py
  - pyi
  - pyw
cwe: CWE-306
pattern: ^(?=.*\bredis\b)(?=.*(?:createClient|Redis)\s*\(\s*\)).*
message: Broken access control — a security decision made from a client value, unverified identifier, or unauthenticated service.
remediation: Pass an explicit connection object/URL that includes a password/ACL user and host from configuration, e.g. createClient({ url, password }) or Redis(password=...). Ensure the target Redis has requirepass/ACLs set.
not-match: ^\s*(?:\/\/|#|\*|<!--)|\b(?:password|passwd|requirepass|tls|test|spec|mock|fixture)\b|\.auth\b|auth\s*\(
why: A Redis client is constructed with empty arguments (redis.createClient(), new Redis(), redis.Redis()/StrictRedis()), which defaults to localhost:6379 with no password, so the app talks to an unauthenticated Redis instance by default. Requiring both a redis token AND an empty-paren constructor on the same line prevents the generic createClient() of Supabase/urql/graphql from matching.
confidence: high
