id: wide/cred-node-fasthash-password-storage
name: cred-node-fasthash-password-storage
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-916
pattern: createHash\(\s*['"](?:md5|sha-?1|sha224|sha256|sha384|sha512)['"]\s*\).*(?:password|passwd|pwd|passphrase|credential)\b|\b(?:md5|sha1|sha256|sha512)\(\s*[\w.$]*(?:password|passwd|pwd|passphrase)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: 'Use a purpose-built password hash: bcrypt.hash / argon2.hash / scrypt / PBKDF2 with a per-user salt and high work factor. Fast hashes are only appropriate for non-credential integrity.'
not-match: bcrypt|argon2|scrypt|pbkdf2|password_hash|hmac|createHmac|\.sign\(|checksum|etag|\bcache|fingerprint|integrity|redact|\bmask|verify|compare|^\s*\/\/
why: A password is run through a fast unsalted digest (crypto.createHash('md5'|'sha1'|...) or an md5()/sha1() helper) for storage, which is trivially brute-forced. The credential token now requires a trailing \b so passwordResetToken (high-entropy random) is not flagged, and the second branch allows an identifier prefix ([\w.$]*) so myPassword/plainPassword are caught. HMAC and file/etag/cache digests are excluded.
confidence: high
