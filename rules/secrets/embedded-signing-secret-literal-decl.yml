id: wide/embedded-signing-secret-literal-decl
name: embedded-signing-secret-literal-decl
category: SECRETS
severity: CRITICAL
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-798
pattern: \b(?:const|let|var)\s+[\w$]*(?:secret|signingkey|signkey|jwtkey|hmackey|tokensecret|privatekey|apisecret)[\w$]*\s*=\s*(['"])[^'"]{6,}\1
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Remove the literal secret from client code and inject it only where it stays private (server-only env var / secret manager). If the value was ever committed or shipped, rotate it. The client should receive already-signed tokens, not the key.
not-match: ^\s*(?:\/\/|\*|\/\*|<!--)|changeme|your[-_]?secret|placeholder|example|\bxxx|\btodo|\$\{
why: A signing/HMAC/private-key secret is declared as a hardcoded string literal in a client-language file, so it ships in the browser bundle and is fully readable. Any secret used to sign tokens or requests is void once it is in client code, enabling token forgery. The value guard requires a string literal (env-var/getter forms are skipped), the 6+ length guard drops empty strings, and placeholder/interpolation forms are excluded via notMatch.
confidence: high
