id: wide/weak-random-ticks-as-token-cs
name: weak-random-ticks-as-token-cs
category: SECRETS
severity: HIGH
languages:
  - cs
  - csx
cwe: CWE-330
pattern: \b(?:session(?:Id|Token|Key)?|sessionid|sid|token|reset(?:Token|Key|Code)?|apiKey|secret(?:Key)?|nonce|csrf(?:Token)?)\b\s*=\s*.{0,60}?(?:new\s+Random\s*\(|\bRandom\s*\.\s*(?:Next|Shared)|DateTime\.(?:Now|UtcNow)\s*\.\s*Ticks|Environment\.TickCount)
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use RandomNumberGenerator.GetBytes / RandomNumberGenerator.Create (or the legacy RNGCryptoServiceProvider) to produce security tokens; never System.Random or a clock value.
not-match: ^\s*(?:\/\/|\*|\/\*)|RandomNumberGenerator|RNGCryptoServiceProvider|SecureRandom|GetBytes
why: System.Random (including Random.Shared) is a non-cryptographic PRNG and DateTime.Now.Ticks / Environment.TickCount are observable clocks; a session id or token built from them is predictable and can be recomputed by an attacker.
confidence: high
