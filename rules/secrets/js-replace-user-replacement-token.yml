id: wide/js-replace-user-replacement-token
name: js-replace-user-replacement-token
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-116
pattern: \.replace(?:All)?\s*\(\s*(?:\/(?:\\.|[^\/\n\\])+\/[a-z]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[A-Za-z_$][\w$.]*)\s*,\s*(?:req|request)\.(?:query|body|params|cookies|headers)(?:\.[\w$]+|\[[^\]]*\])*\s*[)+]
message: Replacement-token injection — user input used as a replace() replacement or preg_replace /e is interpreted, not literal (CWE-116/94).
remediation: Pass a replacer FUNCTION instead of a raw string, e.g. str.replace(pattern, () => userValue), so no token expansion occurs. If a string replacement is required, first escape dollar signs in the user value with a global replace of the dollar sign by a doubled dollar. Never bind untrusted input directly as the replacement argument.
not-match: ^\s*(?:\/\/|\*|\/\*)|\/\\\$\/g|\.replace(?:All)?\s*\([^,]*,\s*(?:function\b|async\b|\()
why: 'The second argument of String#replace / #replaceAll is a REPLACEMENT string, not literal text: the dollar tokens expand to the whole match, the pre-match text, the post-match text, a numbered capture group, or a literal dollar. When that argument is a bare user-controlled identifier/member (or a concatenation led by one) rather than a function or a fixed literal, an attacker can embed those tokens to splice adjacent buffer content into the output. The sink fires only when arg1 is a regex/string/identifier pattern and arg2 is an identifier/member (optionally subscripted) closed by ) or +, so string-literal replacements, inline function replacements (function/async/paren-wrapped, and single-param arrows because `id =>` is followed by = not )/+), CALL replacements like escapeHtml(x) / JSON.stringify(x) / schema.parse(x) (a ( follows the callee), and optional-chaining members like req?.query?.name (the ? is outside [\w$.]) are all excluded by construction; notMatch drops comment lines and lines that globally escape the dollar sign (/\$/g). Verified precise: no regex change was required and it does not fire on any safe twin tested.'
confidence: high
