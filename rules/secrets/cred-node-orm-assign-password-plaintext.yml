id: wide/cred-node-orm-assign-password-plaintext
name: cred-node-orm-assign-password-plaintext
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-256
pattern: \b[\w$]+\??\.(?:password|passwd|pwd|secret|apikey|api_key|token)\s*=\s*(?:req|request|ctx|body|params|query|input|data|form|payload|args|fields)\b[\w.$\[\]'"]*
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Assign await bcrypt.hash(req.body.password, cost) (or argon2.hash) to the field, or use the ORM's hashing hook, before save().
not-match: bcrypt|argon2|scrypt|pbkdf2|password_hash|hashed|generate|\.hash\(|hashsync|===|==|redact|\bmask|\*\*\*|^\s*\/\/
why: A model/entity password field is assigned directly from raw request input (req/body/params/ctx/...), so a subsequent save() persists the plaintext credential. The RHS being a request-input source (not a hash call) is the precision signal; the source keywords require a trailing \b so request_id/database_url are not treated as sources.
confidence: high
