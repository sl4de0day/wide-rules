id: wide/role-session-file-keyed-by-user-py
name: role-session-file-keyed-by-user-py
category: SECRETS
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-807
pattern: \bopen\s*\(\s*[^,;)]*(session|role|auth|acl|perm|priv|grant)[^,;)]*(\+|\{)\s*[^,;)]*\b(user(name)?|uid|user_id|login)\b
message: Broken session management — identity/role from an unverified client value or a writable store (CWE-807/302).
remediation: Key session/role files by a random session id (secrets.token_hex/urlsafe), not by username, and derive that id from a verified session (request.session) or token.
not-match: ^\s*#|request\.session|jwt\.decode|verify=True|itsdangerous
why: A session/role/auth file is opened with a path built (f-string/concat) from a client-controlled username. The user-keyed, writable store means an attacker can address or tamper with another account's authorization state. secrets.token_hex / uuid4 / session_id keys and request.session are excluded.
confidence: high
