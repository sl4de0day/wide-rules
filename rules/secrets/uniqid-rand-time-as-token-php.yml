id: wide/uniqid-rand-time-as-token-php
name: uniqid-rand-time-as-token-php
category: SECRETS
severity: HIGH
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
cwe: CWE-330
pattern: \$(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|token|reset(?:_?token|_?key|_?code)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*=\s*.{0,40}?\b(?:uniqid|mt_rand|rand|microtime|time)\s*\(
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use random_bytes()/bin2hex(random_bytes(32)) or random_int() (CSPRNG) for security tokens; never uniqid, rand, mt_rand, or time().
not-match: ^\s*(?:\/\/|#|\*|\/\*)|random_bytes|random_int|bin2hex|openssl_random|RandomBytes
why: PHP uniqid() is derived from the current microtime, and rand()/mt_rand() are non-cryptographic PRNGs; tokens built from them (often wrapped in md5/sha1) are predictable and enumerable, enabling session or reset-token forgery.
confidence: high
