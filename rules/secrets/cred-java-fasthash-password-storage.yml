id: wide/cred-java-fasthash-password-storage
name: cred-java-fasthash-password-storage
category: SECRETS
severity: HIGH
languages:
  - java
  - kt
  - kts
cwe: CWE-916
pattern: DigestUtils\.(?:md5Hex|md5|sha1Hex|sha1|sha256Hex|sha256|sha384Hex|sha384|sha512Hex|sha512|shaHex)\([^)]*(?:password|passwd|pwd|passphrase|credential)\b|MessageDigest\.getInstance\(\s*"(?:MD5|SHA-?1)"\s*\).*(?:password|passwd|pwd)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Store credentials with a Spring Security BCryptPasswordEncoder / Argon2PasswordEncoder / Pbkdf2PasswordEncoder (or an equivalent library), never a bare MessageDigest/DigestUtils digest.
not-match: BCrypt|Argon2|scrypt|PBKDF2|Pbkdf2|SCryptPasswordEncoder|PasswordEncoder|passwordEncoder|\.matches\(|checksum|etag|\bcache|fingerprint|integrity|redact|\bmask|^\s*(?:\/\/|\*|\/\*)
why: Apache Commons DigestUtils.md5Hex/sha1Hex/sha256Hex/sha512Hex(password) or MessageDigest.getInstance("MD5"|"SHA-1") applied to a password stores a fast unsalted digest. The digest list now includes sha384/sha512 variants, and the credential token requires a trailing \b (passwordResetToken no longer fires). Spring's *PasswordEncoder and verify (.matches) are excluded.
confidence: high
