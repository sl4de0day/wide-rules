id: wide/random-module-as-session-token-py
name: random-module-as-session-token-py
category: SECRETS
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-330
pattern: \b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|access(?:_?token)?|token|reset(?:_?token|_?key|_?code|_?hash)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*=\s*.{0,60}?\brandom\.(?:random|randint|randrange|choice|choices|sample|getrandbits|randbytes)\s*\(
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use the secrets module (secrets.choice, secrets.token_hex, secrets.token_urlsafe) or random.SystemRandom for anything security-sensitive.
not-match: ^\s*#|secrets\.|SystemRandom|os\.urandom|token_hex|token_urlsafe|token_bytes
why: Python's random module is a Mersenne Twister PRNG whose state is recoverable from observed outputs, so session ids and tokens built with random.randint/choice/getrandbits are predictable.
confidence: high
