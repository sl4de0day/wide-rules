id: wide/math-random-as-session-token-js
name: math-random-as-session-token-js
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-330
pattern: \b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|access(?:_?token)?|token|reset(?:_?token|_?key|_?code|_?hash)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*[:=]\s*.{0,30}?Math\.random\s*\(\s*\)
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: 'Replace Math.random() with a CSPRNG: crypto.randomBytes / crypto.randomUUID in Node, or crypto.getRandomValues in the browser.'
not-match: ^\s*(?:\/\/|\*|\/\*|#)|randomBytes|randomUUID|getRandomValues|crypto\.random|\bsecrets\b|SecureRandom
why: Math.random() is a non-cryptographic PRNG whose internal state can be recovered from a few outputs, so tokens or session ids built from it are predictable and forgeable.
confidence: high
