cwe: CWE-942
pattern: ^(?=.*(?:Access-Control-Allow-Origin['"`]\]?\s*[,:=]\s*['"`]?\*|\borigin['"]?\s*:\s*['"]?\*))(?=.*(?:Access-Control-Allow-Credentials['"`]\]?\s*[,:=]\s*['"`]?true|\bcredentials['"]?\s*:\s*true)).*
message: Insecure CORS — reflecting the request Origin (with credentials) instead of a fixed allowlist (CWE-942).
remediation: Never pair a wildcard origin with credentials. If credentials are required, echo a single validated allowlisted origin instead of `*`; for public non-credentialed APIs, drop Access-Control-Allow-Credentials entirely. A fixed literal origin with credentials (e.g. 'https://app.example.com') is the safe form and is not flagged.
not-match: ^\s*(?:\/\/|#|\*|\/\*|<!--)
why: 'Setting Access-Control-Allow-Origin to `*` while also sending Access-Control-Allow-Credentials: true is an invalid-but-dangerous combination. Browsers reject `*` with credentials, so developers who see it ''not work'' typically switch to reflecting the Origin (the real bug), and some proxies / older or hand-rolled stacks still honor it — letting any site read credentialed responses. The sink uses two lookaheads so it fires only when a wildcard origin AND a truthy Allow-Credentials appear on the same line (setHeader pair, writeHead/object headers, bracket-assignment, PHP header() pair, or a cors() config object). notMatch only drops comment lines; a fixed literal origin, or credentials:false, breaks a lookahead and is not flagged.'
confidence: high
