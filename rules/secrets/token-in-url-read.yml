id: wide/token-in-url-read
name: token-in-url-read
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
  - xhtml
  - vue
  - svelte
cwe: CWE-598
pattern: \.get\s*\(\s*['"](?:auth[_-]?token|access[_-]?token|id[_-]?token|jwt|password|secret|api[_-]?key|token)['"]|req\.query\.(?:auth[_-]?token|access[_-]?token|token|jwt|password|secret|api[_-]?key)\b
message: An authentication token or secret is read from the URL query string.
remediation: Send tokens in an Authorization header or an HttpOnly cookie, never in the query string.
why: Tokens in the URL leak through browser history, the Referer header, and server/proxy access logs, so the credential is exposed far beyond the intended request.
confidence: high
