pattern: \b(?:password|passwd|pwd|token|otp|api[_-]?key|apikey|secret|pin|access[_-]?code|master[_-]?key|auth[_-]?key)\w*\s*===?\s*["'`](?:admin|administrator|backdoor|master|bypass|letmein|password|passw0rd|123456|000000|111111|test123|guest|root|default|changeme)["'`]
message: A credential or token is compared against a hard-coded value — a backdoor or default credential.
remediation: Never authenticate against a hard-coded value. Verify credentials against per-user secrets stored as salted hashes, and gate any debug bypass behind a build that never ships.
not-match: ^\s*(?:\/\/|\*|\/\*|#)
why: Authenticating by comparing user input to a constant like "admin" or "backdoor" means anyone who reads the source, or guesses the well-known default, authenticates as a privileged user. Hard-coded bypasses routinely survive into production and defeat every other access control.
confidence: medium
