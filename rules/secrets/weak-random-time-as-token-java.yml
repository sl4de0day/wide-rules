id: wide/weak-random-time-as-token-java
name: weak-random-time-as-token-java
category: SECRETS
severity: HIGH
languages:
  - java
  - kt
  - kts
cwe: CWE-330
pattern: \b(?:session(?:Id|Token|Key)?|sessionid|sid|authToken|accessToken|token|reset(?:Token|Key|Code)?|apiKey|secret(?:Key)?|nonce|csrf(?:Token)?)\b\s*=\s*.{0,60}?(?:new\s+Random\s*\(|\bRandom\s*\.\s*next|Math\.random\s*\(|System\.currentTimeMillis\s*\(|System\.nanoTime\s*\(|ThreadLocalRandom)
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use java.security.SecureRandom (or UUID.randomUUID, which is backed by SecureRandom) for session ids and tokens.
not-match: ^\s*(?:\/\/|\*|\/\*)|SecureRandom|randomUUID|KeyGenerator
why: java.util.Random / Math.random / ThreadLocalRandom are non-cryptographic PRNGs and System.currentTimeMillis / nanoTime are observable clocks; using them to build a session id or token yields a predictable value an attacker can reproduce.
confidence: high
