id: wide/cwe330-python-insecure-random-secret
name: cwe330-python-insecure-random-secret
category: SECRETS
severity: MEDIUM
languages:
  - py
  - pyi
  - pyw
cwe: CWE-330
pattern: \b(?:token|password|passwd|salt|nonce|otp|secret|secret_key|api_?key|csrf|iv)\s*=[^=].*\brandom\.(?:random|randint|randrange|choice|choices|getrandbits|sample|shuffle|uniform)\s*\(
message: A security value (token/password/secret/etc.) is generated with Python's non-cryptographic random module.
remediation: Use the secrets module (e.g. secrets.token_hex, secrets.choice) for security-sensitive randomness.
why: The random module is a Mersenne-Twister PRNG whose output is predictable from prior values, so secrets built from it can be reconstructed.
confidence: high
