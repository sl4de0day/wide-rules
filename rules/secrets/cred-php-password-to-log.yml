id: wide/cred-php-password-to-log
name: cred-php-password-to-log
category: SECRETS
severity: MEDIUM
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
cwe: CWE-532
pattern: (?:error_log|syslog|Log::(?:info|debug|warning|warn|error|critical|notice|alert|emergency)|->(?:info|debug|warning|error|notice|log))\(\s*(?:[^)]*?[.,]\s*)?\$[\w>\-\['"\]]*(?:password|passwd|pwd|passphrase|secret|token)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Never log credential variables; log a redacted value and scrub sensitive keys in the log formatter/monolog processor.
not-match: redact|\bmask|\*{3,}|xxxx|\bhash|sanitiz|scrub|password_hash|password_verify|\[redacted\]|^\s*(?:\/\/|#|\*)
why: error_log/syslog/Log::/$logger-> emits a password/secret PHP variable ($password, $_POST['password'], $user->password, concatenated), persisting the plaintext credential to logs. Requiring a $-variable whose name ends in the credential token at a \b keeps 'reset your password' string messages and $tokenBucket out.
confidence: high
