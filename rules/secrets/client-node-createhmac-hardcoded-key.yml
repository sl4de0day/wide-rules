id: wide/client-node-createhmac-hardcoded-key
name: client-node-createhmac-hardcoded-key
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-321
pattern: \bcreateHmac\s*\(\s*(['"`])[A-Za-z0-9-]+\1\s*,\s*(['"`])[^'"`\r\n]{3,}\2\s*(?:[,)]|$)
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Keep createHmac on the server with the key sourced from a non-public secret (process.env without a client-inlined prefix, KMS, or a secrets manager). Expose only a signing endpoint to the client.
not-match: changeme|change[_-]?me|your[-_ ]?(?:secret|key|token|hmac|password)|example|placeholder|sample|dummy|foobar|todo|xxxx?|<[^>\r\n]+>|\$\{|process\.env
why: crypto.createHmac(algorithm, <key>) is given a hardcoded string literal key. When this code is bundled to the client (or crypto is polyfilled in the browser), the key ships to every user and any HMAC it computes can be forged. The signing key must never leave the server.
confidence: high
