id: wide/embedded-jwt-secret-literal
name: embedded-jwt-secret-literal
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-321
pattern: \b(?:jwt|jsonwebtoken)\.sign\s*\(.*?,\s*(['"])[^'"]{6,}\1\s*[,)]
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Load the signing secret from server-only configuration (a non-public environment variable or secret manager), never a source literal, and move signing to the server. Rotate any key that has been committed.
not-match: ^\s*(?:\/\/|\*|\/\*|<!--)
why: The JWT signing key is passed to jwt.sign() as a hardcoded string literal. A hardcoded cryptographic key in source (and especially in a shipped bundle) is recoverable by anyone, so all tokens can be forged and the signature provides no authenticity. The length/position guard targets the actual secret argument, and the trailing [,)] guard prevents matching object string-keys ('key':) so algorithm/option strings like 'HS256' or 'abc123' inside an options object are not flagged.
confidence: high
