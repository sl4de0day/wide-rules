pattern: '[''"\x60]\s*(?:http_)?(?:x[-_]forwarded[-_]for|x[-_]original[-_]forwarded[-_]for|x[-_]cluster[-_]client[-_]ip|x[-_]real[-_]ip|x[-_]client[-_]ip|cf[-_]connecting[-_]ip|true[-_]client[-_]ip|fastly[-_]client[-_]ip|forwarded(?=[''"\x60]))\b'
message: Spoofable client-IP header (X-Forwarded-For) used as a security key — rate-limit / identity bypass (CWE-348).
remediation: 'Key rate limiting and lockout on a trusted source, not a raw client header. Configure the framework''s trusted-proxy option and use its derived address: Express app.set(''trust proxy'', <hopCount|CIDRs>) then req.ip; Flask ProxyFix(x_for=<n>) then request.remote_addr; Go/Java a vetted RealIP middleware bound to known proxy CIDRs. If you must parse X-Forwarded-For, take the entry your own proxy appended (right-most trusted-to-untrusted), validate it as an IP, and combine it with an authenticated account id. Never trust the left-most/raw header value as the limiter key. If a trusted edge proxy sets the header, have it strip any inbound copy on ingress.'
not-match: ^\s*(?:\/\/|#|\*|\/\*|--|<!--)|\bconsole\b|\blogger\b|\blogging\b|getlogger|\bslog\b|\bwinston\b|\bpino\b|\bbunyan\b|\blogrus\b|\bslf4j\b|\berror_log\b|\bsyslog\b|\.(?:debug|info|warn(?:ing)?|error|trace|fatal|critical|exception|notice|verbose|silly|log)\s*\(|\baudit|\banalytics|\.track\s*\(|\btelemetry|\bmetric|\bprometheus|\bstatsd|\bdatadog|\bnewrelic|\bsentry\b|\bgrafana|\bmixpanel|\bamplitude|\bsegment\b|\bobserve\s*\(|\bhistogram|\bgauge\b|\btrusted|allow[-_]?list|\bwhitelist|knownproxies|\bproxylist|set[Hh]eader|write[Hh]ead|\.headers\.set\s*\(|res\.set\b|response\.set|\bdelete\s|\bexpect\s*\(|\blog\b
why: A spoofable client-IP header (X-Forwarded-For, X-Real-IP, X-Client-IP, CF-Connecting-IP, True-Client-IP, RFC 7239 Forwarded, or PHP's HTTP_X_* mapping) is read straight into a clientIp/identity variable or used as the key of a rate limiter, failed-attempt counter, or account-lockout map. These headers are fully client-controlled and pass untouched through any proxy that does not strip them, so an attacker rotates the value per request to land in a fresh bucket and bypass the rate limit or brute-force lockout (or forge another user's identity/key). Complement of the netauthz forwardable-header rules, whose notMatch deliberately excludes this rate-limit / IP-extraction shape; here notMatch still prunes logging/audit/analytics/metrics, trusted-proxy allowlist validation, header-setting, ingress-stripping (delete), test assertions, and comments. req.ip / remoteAddress are intentionally NOT in notMatch so the header-first fallback (req.headers['x-forwarded-for'] || req.socket.remoteAddress) stays flagged.
confidence: high
