id: wide/client-jwt-sign-hardcoded-secret
name: client-jwt-sign-hardcoded-secret
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-321
pattern: \b(?:jwt|jsonwebtoken)\.sign\s*\([^)]*?,\s*(['"`])[^'"`\r\n]{3,}\1\s*(?:[,)]|$)
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Move token issuance to a server endpoint that holds the signing key in a non-public secret (server env var, KMS/Vault, secrets manager). The client should receive a token from that endpoint, never sign one. If asymmetric verification is needed client-side, ship only the public key and verify RS/ES tokens.
not-match: changeme|change[_-]?me|your[-_ ]?(?:secret|key|token|hmac|password)|example|placeholder|sample|dummy|foobar|todo|xxxx?|<[^>\r\n]+>|\$\{|process\.env
why: jsonwebtoken's jwt.sign(payload, <secret>) is given a hardcoded string literal as the HMAC signing key. In a browser-shipped bundle that key is fully readable by any user, so anyone can mint valid tokens with arbitrary claims — the signature proves nothing. Token signing must happen on a server holding the secret.
confidence: high
