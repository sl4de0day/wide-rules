id: wide/jwt-long-lived-token
name: jwt-long-lived-token
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
  - xhtml
  - vue
  - svelte
cwe: CWE-613
pattern: \bexpiresIn\s*:\s*['"`]?(?:\d+\s*(?:y|years?)|[1-9]\d{2,}\s*d\b|\d{8,})
message: A token or session is issued with a very long lifetime.
remediation: Keep access tokens short-lived (minutes to hours) and use a revocable refresh token or server-side session for longer sessions.
not-match: ^\s*(?:\/\/|\*|\/\*)
why: 'A JWT or session that lives for months or years cannot be revoked in practice: a stolen token stays valid long after the breach, and there is no natural point to re-check the user''s status or permissions.'
confidence: medium
