id: wide/client-cryptojs-hmac-token-mint
name: client-cryptojs-hmac-token-mint
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-602
pattern: \bCryptoJS\.Hmac\w*\s*\(
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Do keyed HMAC on the server and send the client only the resulting signature, or verify HMACs server-side. Never ship the HMAC secret to the browser. Use CryptoJS.SHA256 (unkeyed) only for non-security digests on the client.
not-match: ^\s*(?:\/\/|\*|\/\*|<!--)
why: CryptoJS.HmacSHA256/HmacSHA1/HmacMD5(message, secret) computes a keyed MAC entirely in the browser (CryptoJS is a client-side crypto library). The secret is therefore in the shipped bundle, so an attacker reads it and forges valid HMAC tokens/signatures. This is the classic raw-HMAC-token-in-client anti-pattern.
confidence: high
