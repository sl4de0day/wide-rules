cwe: CWE-668
pattern: new\s+BroadcastChannel\s*\(
message: A BroadcastChannel is readable by every context on the same origin.
remediation: Do not send secrets over a BroadcastChannel; use a targeted postMessage with an explicit origin.
why: Any tab, iframe, or extension on the origin can listen on the same channel name, so tokens or session data broadcast over it are exposed to all of them.
confidence: high
