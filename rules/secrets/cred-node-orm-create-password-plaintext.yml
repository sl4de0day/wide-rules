id: wide/cred-node-orm-create-password-plaintext
name: cred-node-orm-create-password-plaintext
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-256
pattern: \b(?:password|passwd|pwd|secret|api_?key|token)\s*:\s*(?:req|request|ctx|body|params|query|input|data|form|payload|userinput)\b\.
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: 'Hash the password before building the object: { password: await bcrypt.hash(req.body.password, cost) }, or use a beforeCreate hook.'
not-match: bcrypt|argon2|scrypt|pbkdf2|password_hash|hashed|\.hash\(|hashsync|\bwhere\b|findone|findby|redact|\bmask|\*\*\*|^\s*\/\/
why: 'An ORM create/insert object literal sets a password key straight from a request-input object (User.create({ password: req.body.password })), persisting the plaintext credential. Requiring the value to be a request source keeps returned-secret and hashed-value cases out; notMatch now also drops where/findOne/findBy lookups (plaintext compare, not storage).'
confidence: high
