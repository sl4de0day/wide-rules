id: wide/cred-python-hashlib-fasthash-password
name: cred-python-hashlib-fasthash-password
category: SECRETS
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-916
pattern: \b(?:hashlib\.)?(?:md5|sha1|sha224|sha256|sha384|sha512)\([^)]*(?:password|passwd|pwd|passphrase)\b|hashlib\.new\(\s*['"](?:md5|sha-?1)['"][^)]*(?:password|passwd|pwd)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Store credentials with passlib/argon2-cffi/bcrypt or hashlib.pbkdf2_hmac with a random per-user salt and >=200k iterations; use Django set_password/make_password with a strong hasher.
not-match: bcrypt|argon2|scrypt|pbkdf2|passlib|password_hash|make_password|hmac|checksum|etag|\bcache|fingerprint|integrity|redact|\bmask|verify|compare|^\s*#
why: hashlib.md5/sha1/sha256(password) (or hashlib.new('md5', password)) stores a password behind a fast unsalted digest. A trailing \b on the credential token now prevents matching password_reset_token (a random token). PBKDF2 (pbkdf2_hmac), HMAC, Django make_password, passlib and file/cache checksums are excluded.
confidence: high
