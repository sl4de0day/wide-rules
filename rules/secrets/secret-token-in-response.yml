cwe: CWE-200
pattern: ^(?=.*(?:\.(?:json|jsonp|send)\s*\(|jsonify\s*\(|gin\.H|render\s+json|->json\s*\(|JsonResponse|JsonResult|c\.JSON|return\s+Json|res\.write))(?=.*\b(?:otp|reset_?token|verification_?code|verificationCode|resetToken|private_?key|privateKey|api_?key|apiKey|client_?secret|clientSecret|mfa_?code|totp|security_?code|one_?time_?password)\b).*$
message: GraphQL/dev misconfiguration — introspection or a dev endpoint exposed, or a weak/predictable secret (CWE-200/489/307/770/330).
remediation: Never echo these values back; deliver them only through the intended side channel (email/SMS) and return just a status. Compare submitted codes server-side against a stored hash.
not-match: ^\s*(?:\/\/|#|\*|\/\*|<!--)|NODE_ENV|isAdmin|is_admin|requireAdmin|admin_required|@admin|hashed|passwordHash|_hash\b|bcrypt|scrypt|argon2?|pbkdf2|\bredact\w*|\bmask\w*|\*{3,}|X{4,}|:\s*(?:null|undefined|None|nil|''|""|0)\b|=\s*(?:null|None|nil)\b
why: Returning an OTP, password-reset token, verification/MFA code, API key, or private key in an HTTP response body hands the out-of-band secret straight to the caller, defeating email/SMS verification and letting an attacker complete resets or impersonate the service. Requires both a responder (.json/.send/jsonify/gin.H/c.JSON/JsonResult) and a bounded secret keyword; suppressed when the value is hashed, masked, redacted, starred, or null.
confidence: high
