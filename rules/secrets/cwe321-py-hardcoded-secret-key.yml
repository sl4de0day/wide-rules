id: wide/cwe321-py-hardcoded-secret-key
name: cwe321-py-hardcoded-secret-key
category: SECRETS
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-321
pattern: SECRET_KEY['"]?\s*\]?\s*=\s*['"][^'"]{4,}['"]
message: A framework SECRET_KEY is assigned a hardcoded string literal.
remediation: Load the key from an environment variable or secrets manager, e.g. os.environ['SECRET_KEY'].
why: A signing key committed to source lets anyone who reads the repo forge session cookies, CSRF tokens, and other signed data.
confidence: high
