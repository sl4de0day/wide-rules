id: wide/client-token-issued-on-auth-failure-branch
name: client-token-issued-on-auth-failure-branch
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-287
pattern: \bif\s*\(\s*!\s*(?:user|valid|isValid|match|passwordMatch|authenticated|authorized|ok|success|found|correct|verified|passwordCorrect)\b[^}]*(?:res\.cookie\s*\(\s*['"](?:session|token|auth|jwt|sid|sess)|jwt\.sign\s*\(|signToken\s*\(|issueToken\s*\(|generateToken\s*\(|createSession\s*\(|setAuthCookie\s*\()
message: Broken access control — a security decision made from a client value, unverified identifier, or unauthenticated service.
remediation: On the failure branch return an error (401/403) and issue nothing. Emit the session/JWT only after a successful credential comparison, on the success branch. If a deliberate guest token is intended, scope it explicitly (role 'guest'/'anonymous') and never as a full session.
not-match: (?:guest|anonymous|anon|public|^\s*\/\/|^\s*\*|^\s*\/\*)
why: A session cookie or signed JWT is issued on the FAILURE branch of the auth check (if(!user)/if(!valid)...). Failed logins receive a valid authenticated session, so anyone can obtain credentials without knowing them. The condition-to-issuance span is bounded to a single brace block ([^}]*) so it does not bridge into an else/success branch.
confidence: high
