id: wide/public-env-inlined-secret
name: public-env-inlined-secret
category: SECRETS
severity: CRITICAL
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-798
pattern: \b(?:process\.env|import\.meta\.env)\.(?:NEXT_PUBLIC_|REACT_APP_|VITE_|VUE_APP_|GATSBY_|EXPO_PUBLIC_)[A-Z0-9_]*(?:SECRET|PRIVATE|SIGNING|HMAC|PASSWORD|PASSWD|PASSPHRASE|JWT)[A-Z0-9_]*\b
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Drop the public prefix and read the secret only in server-side code (a route handler, server component, or API), or move the operation that needs it behind a server endpoint. Public prefixes are for values that are safe to publish (URLs, publishable keys, analytics IDs, public verification keys).
not-match: PUBLIC_KEY\b|PUBLISHABLE|VERIFY_KEY|VERIFICATION_KEY
why: A secret-named value is read from a client-inlined env prefix (NEXT_PUBLIC_/REACT_APP_/VITE_/VUE_APP_/GATSBY_/EXPO_PUBLIC_). Bundlers statically replace these with their literal value at build time, so the secret is compiled into the JS delivered to browsers and is fully exposed — using it to sign or authorize is worthless.
confidence: high
