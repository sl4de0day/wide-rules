id: wide/cred-php-fasthash-password-storage
name: cred-php-fasthash-password-storage
category: SECRETS
severity: HIGH
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
cwe: CWE-916
pattern: \bmd5\(\s*\$[\w>\-\['"\]]*(?:password|passwd|pwd|pass|passphrase)\b|\bsha1\(\s*\$[\w>\-\['"\]]*(?:password|passwd|pwd|pass)\b|\bhash\(\s*['"](?:md5|sha1|sha256|sha512|crc32)['"]\s*,\s*\$?[\w>\-\['"\]]*(?:password|passwd|pwd|pass)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Use password_hash($password, PASSWORD_ARGON2ID) (or PASSWORD_BCRYPT) to store, and password_verify() to check. Never md5/sha1 a password.
not-match: password_hash|password_verify|bcrypt|argon2|PASSWORD_(?:BCRYPT|ARGON2|DEFAULT)|crypt\(|hash_equals|hash_hmac|checksum|etag|\bcache|fingerprint|integrity|redact|\bmask|^\s*(?:\/\/|#|\*)
why: md5($password)/sha1($password) or hash('sha256', $password) produces a fast unsalted digest used as the stored password. The credential name requires a trailing \b, so $passthrough and $password_reset (random reset token) are not flagged. PHP's own password_hash()/password_verify(), hash_hmac and non-credential hashes are excluded.
confidence: high
