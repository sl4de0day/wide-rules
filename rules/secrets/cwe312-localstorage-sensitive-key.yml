id: wide/cwe312-localstorage-sensitive-key
name: cwe312-localstorage-sensitive-key
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
  - xhtml
  - vue
  - svelte
cwe: CWE-312
pattern: \b(?:local|session)Storage\.setItem\([^)]*(?:token|password|passwd|pwd|secret|jwt|api[_-]?key|access[_-]?token|refresh[_-]?token|session|credential|private[_-]?key)
message: A secret-looking value is being written to localStorage/sessionStorage.
remediation: Keep tokens in memory or in a Secure, HttpOnly, SameSite cookie set by the server rather than in Web Storage.
why: Web Storage is plaintext, unencrypted, and readable by any JavaScript on the origin, so any XSS immediately exfiltrates the token, password, or session identifier.
confidence: high
