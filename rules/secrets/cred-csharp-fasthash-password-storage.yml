id: wide/cred-csharp-fasthash-password-storage
name: cred-csharp-fasthash-password-storage
category: SECRETS
severity: HIGH
languages:
  - cs
  - csx
cwe: CWE-916
pattern: \.ComputeHash\([^;]*(?:password|passwd|pwd|passphrase)\b|\b(?:MD5|SHA1|SHA256|SHA512)\.HashData\([^;]*(?:password|passwd|pwd|passphrase)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Use ASP.NET Core Identity PasswordHasher<T> (or Rfc2898DeriveBytes/PBKDF2 with a random salt and high iteration count, or a BCrypt/Argon2 library). Never store an MD5/SHA hash of a password.
not-match: BCrypt|Bcrypt|Argon2|scrypt|Rfc2898|PBKDF2|Pbkdf2|PasswordHasher|HashPassword|VerifyHashedPassword|IdentityUser|HMAC|Hmac|checksum|etag|\bcache|fingerprint|integrity|redact|\bmask|^\s*(?:\/\/|\*|\/\*)
why: MD5/SHA1/SHA256 .ComputeHash(...password...) or SHA*.HashData(...password...) stores a password behind a fast unsalted digest. notMatch now suppresses HMAC*.ComputeHash (keyed), and the credential token requires a trailing \b (passwordResetToken excluded). ASP.NET Core PasswordHasher, Rfc2898/PBKDF2, BCrypt and non-credential checksums are excluded.
confidence: high
