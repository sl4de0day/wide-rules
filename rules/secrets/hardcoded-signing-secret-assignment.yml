id: wide/hardcoded-signing-secret-assignment
name: hardcoded-signing-secret-assignment
category: SECRETS
severity: CRITICAL
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-798
pattern: \b(?:jwt[_-]?secret|jwt[_-]?key|signing[_-]?key|signing[_-]?secret|secret[_-]?key|hmac[_-]?key|hmac[_-]?secret|token[_-]?secret|app[_-]?secret|auth[_-]?secret|client[_-]?secret|private[_-]?key)\b\s*(?:=|:(?:\s*[\w.<>\[\]| ]+\s*=)?)\s*(['"`])[^'"`\r\n]{4,}\1
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Read the secret from a non-public secret source at runtime (server-only env var, KMS, Vault, secrets manager) and remove the literal from source. Rotate any secret that was ever committed. Public keys and non-secret identifiers can stay literal.
not-match: changeme|change[_-]?me|your[-_ ]?(?:secret|key|token|hmac|password)|example|placeholder|sample|dummy|foobar|todo|xxxx?|<[^>\r\n]+>|\$\{|process\.env
why: 'A variable or property named for a signing secret (JWT_SECRET, signingKey, hmacSecret, clientSecret, privateKey, ...) is assigned a hardcoded string literal. In a client bundle this is a shipped credential: it is trivially extracted and lets an attacker sign or impersonate. Even in server code it is a hardcoded-credential smell.'
confidence: high
