id: wide/secret-logging
name: secret-logging
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
  - xhtml
  - vue
  - svelte
cwe: CWE-532
pattern: \b(?:console|logger|log|winston|pino)\.(?:log|error|warn|info|debug|trace|silly)\s*\([^)]*\b(?:password|passwd|pwd|token|secret|api[_-]?key|credit[_-]?card|creditCard|ssn|cvv|pin|privateKey)\b
message: A credential/secret is written to a log.
remediation: Never log secrets; redact the field or log only a non-sensitive identifier.
why: Logs are stored, shipped to aggregators, and read by many people; a password or token in stdout leaks it far beyond the process (OWASP A09, PCI-DSS/GDPR).
confidence: high
