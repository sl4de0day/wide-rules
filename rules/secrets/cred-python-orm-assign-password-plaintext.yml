id: wide/cred-python-orm-assign-password-plaintext
name: cred-python-orm-assign-password-plaintext
category: SECRETS
severity: HIGH
languages:
  - py
  - pyi
  - pyw
cwe: CWE-256
pattern: (?:\b\w+\.)?(?:password|passwd|pwd|passphrase|secret|api_?key|apikey|token)\s*=\s*(?:request|req|self\.request|flask\.request|form|cleaned_data|data|payload|params|body|input|json)\b[\w.\[\]()'"]*
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Use user.set_password(raw) (Django) or store generate_password_hash(pw) / passlib / argon2 output; never assign the raw request password to the field.
not-match: make_password|generate_password_hash|bcrypt|argon2|scrypt|pbkdf2|passlib|set_password|password_hash|check_password|\bhash|redact|\bmask|\*\*\*|==|^\s*#
why: A model password attribute or ORM kwarg is set directly from raw request input (request.POST/data/form/...), so the row persists the plaintext credential. The source keyword requires a trailing \b so request_id/database_url are not sources. Django set_password/make_password, werkzeug generate_password_hash and comparisons are excluded.
confidence: high
