id: wide/client-cryptojs-hmac-hardcoded-key
name: client-cryptojs-hmac-hardcoded-key
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-321
pattern: \bCryptoJS\.Hmac(?:MD5|SHA1|SHA224|SHA256|SHA384|SHA512|SHA3|RIPEMD160)\s*\([^)]*?,\s*(['"`])[^'"`\r\n]{3,}\1\s*(?:[,)]|$)
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Compute the HMAC on a server that holds the key in a secret store, and have the client call that endpoint. If the value only needs integrity against accidental corruption (not attackers), say so explicitly and do not treat it as a security control.
not-match: changeme|change[_-]?me|your[-_ ]?(?:secret|key|token|hmac|password)|example|placeholder|sample|dummy|foobar|todo|xxxx?|<[^>\r\n]+>|\$\{|process\.env
why: CryptoJS.HmacSHA*/HmacMD5 is called with a hardcoded string literal as the HMAC key. Shipped to the client, this key is readable in the bundle, so attackers can forge any signature it protects (request signing, integrity tags, tamper checks). Client-side HMAC with an embedded key provides no security guarantee.
confidence: high
