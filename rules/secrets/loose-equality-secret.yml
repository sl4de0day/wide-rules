cwe: CWE-697
pattern: \b(?:resetCode|token|otp|code|pin|password|passwd|pwd|secret|apiKey|role|isAdmin|verified|authenticated|hash)\w*\s*[!=]=(?!=)
message: A secret/code/role is compared with loose == (type coercion) instead of ===.
remediation: Use strict === / !==, and compare secrets with a constant-time equality.
why: 'With ==, {"resetCode": 0} or false coerces so that resetCode == 0 or resetCode == "" is true — an attacker passes a falsy value and bypasses the check without knowing the real code.'
confidence: high
