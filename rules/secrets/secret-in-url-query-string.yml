cwe: CWE-598
pattern: \?(?:[^"'\s]*&)?(api_?key|access_?token|refresh_?token|reset_?token|id_?token|auth_?token|token|passwd|password|pwd|client_?secret|secret|session_?id|sessionid|session|sid|jwt|otp)=
message: Data leakage — a downgraded Referrer-Policy or a secret carried in the URL (CWE-693/598).
remediation: Never put secrets in a URL. Send them in a POST body or an Authorization header; if a link must carry a credential use a short-lived, single-use opaque value delivered out of band.
not-match: ^\s*(?:\/\/|#|\*|<!--|\/\*)
why: A secret (token, api key, password, session id, jwt, otp, reset/access token) placed in a URL query string leaks through browser history, bookmarks, server and proxy access logs, and the Referer header when the page loads sub-resources or is linked out. The sink is gated on a literal '?' so only true URL query strings match (form-encoded POST bodies and object/dict bodies have no leading '?'); the optional [^"'\s]*& group anchors a param name either directly after the '?' or immediately after an '&', while forbidding quotes and whitespace so the match cannot cross string-concatenation boundaries; and the required immediate '=' after an exact param name means non-secret params (page, q, tab, sort, lang, limit, offset, id), longer names that merely contain a keyword (pageToken, tokenType, token_type, csrf_token, sort_token, tokenizer, access_token_expires, sessionType), and keywords that appear only as a value rather than a param (section=passwords) never fire.
confidence: high
