cwe: CWE-521
pattern: \bpassword\w*\b[^\n]*?(?:\.length\s*(?:>=?|===?)\s*[1-7]\b|(?:min[_-]?length|minlength)\s*[:=]\s*['"]?[1-7]\b|\.min\(\s*[1-7]\b)
message: Password policy allows fewer than 8 characters.
remediation: Require at least 8 (ideally 12+) characters, check candidates against a breached-password list, and prefer passphrases over arbitrary complexity rules.
not-match: ^\s*(?:\/\/|\*|\/\*|#)|max[_-]?length|\.max\(
why: A minimum length below 8 lets users pick trivially guessable passwords and makes offline cracking and credential-stuffing far easier. Length is the single strongest lever on password strength.
confidence: low
