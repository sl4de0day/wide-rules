id: wide/secret-in-response
name: secret-in-response
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
  - xhtml
  - vue
  - svelte
cwe: CWE-200
pattern: (?:res\.(?:json|send|end|write)|return)\b[^;\n]*\b(?:SECRET|SIGNATURE|signingKey|privateKey|masterKey|secretKey|apiSecret|SECRET_KEY|SECRET_SIGNATURE)\b
message: A secret/signing key is sent in the HTTP response.
remediation: Never send secrets to the client; return only the specific, non-sensitive values the caller needs.
why: Returning the app's signing key or a server secret to the client hands an attacker the power to forge tokens or decrypt data — the whole trust model collapses.
confidence: high
