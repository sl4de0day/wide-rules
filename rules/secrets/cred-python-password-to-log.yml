id: wide/cred-python-password-to-log
name: cred-python-password-to-log
category: SECRETS
severity: MEDIUM
languages:
  - py
  - pyi
  - pyw
cwe: CWE-532
pattern: (?:(?:logging|logger|log|LOG|self\.logger|app\.logger|current_app\.logger)\.(?:info|debug|warning|warn|error|critical|exception|log)|print)\(\s*(?:[^)]*?(?:[,({%]|\+|\{)\s*)?(?:[\w.\[\]'"]+\.)?(?:password|passwd|pwd|passphrase|secret|api_?key|apikey|token|credential)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Do not log credential values; log a redacted placeholder and add a logging filter that scrubs password/secret/token fields.
not-match: redact|\bmask(?:ed)?\b|\*{3,}|xxxx|\bhash|sanitiz|scrub|\blen\(|\.length|\[redacted\]|password_hash|make_password|getpass|^\s*#
why: logging/print emits a password/secret VALUE as a bare arg, %-format arg, +concat, or f-string {password} interpolation, persisting the plaintext credential to logs. Literals merely containing the word 'password' (with no delimiter+credential structure) and redacted values are excluded.
confidence: high
