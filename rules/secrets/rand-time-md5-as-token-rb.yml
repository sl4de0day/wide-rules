id: wide/rand-time-md5-as-token-rb
name: rand-time-md5-as-token-rb
category: SECRETS
severity: HIGH
languages:
  - rb
cwe: CWE-330
pattern: (?:@{0,2})\b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|token|reset(?:_?token|_?key|_?code)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*=\s*.{0,60}?(?:\brand\s*\(|\brand\b\s*\.|Random\.rand|Time\.now\.to_[if]|Time\.now\.strftime|Digest::(?:MD5|SHA1)\b)
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use SecureRandom (SecureRandom.hex, SecureRandom.urlsafe_base64, SecureRandom.uuid) for session ids, reset tokens, and API keys.
not-match: ^\s*#|SecureRandom
why: Ruby's Kernel#rand / Random.rand is a non-cryptographic PRNG, Time.now is observable, and Digest::MD5/SHA1 of such data adds no entropy; tokens built this way are predictable and forgeable.
confidence: high
