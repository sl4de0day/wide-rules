id: wide/role-session-file-keyed-by-user-rb
name: role-session-file-keyed-by-user-rb
category: SECRETS
severity: HIGH
languages:
  - rb
cwe: CWE-807
pattern: \bFile\.(read|write|open|binread|binwrite)\s*\(\s*[^,;)]*(session|role|auth|acl|perm|priv|grant)[^,;)]*(\+|#\{)\s*[^,;)]*\b(user(name)?|uid|user_id|login)\b
message: Broken session management — identity/role from an unverified client value or a writable store (CWE-807/302).
remediation: Store session/role state in the Rails session (signed/encrypted, keyed by a random id) or a trusted store, and key any file by a CSPRNG session id derived from verified state (session[:user_id]).
not-match: ^\s*#|session\[|cookies\.signed|cookies\.encrypted
why: 'A session/role/auth file is read or written at a path built (concat or #{} interpolation) from a client-controlled username. The user-keyed, writable file means an attacker can address or tamper with another account''s authorization state. SecureRandom.uuid/hex, session_id, and session[...] keys are excluded.'
confidence: high
