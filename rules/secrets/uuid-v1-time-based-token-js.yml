id: wide/uuid-v1-time-based-token-js
name: uuid-v1-time-based-token-js
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-330
pattern: \b(?:session(?:_?id|_?token|_?key)?|sess(?:_?id)?|sid|auth(?:_?token)?|access(?:_?token)?|token|reset(?:_?token|_?key|_?code|_?hash)?|api_?key|secret(?:_?key)?|nonce|csrf(?:_?token)?)\b\s*[:=]\s*.{0,25}?\buuid[._]?v1\s*\(
message: Predictable session/token identifier — a security id from a non-CSPRNG or observable source (CWE-330/340).
remediation: Use a random UUID (uuid v4 / crypto.randomUUID()) or crypto.randomBytes for security identifiers, not the time-based uuid v1.
not-match: ^\s*(?:\/\/|\*|\/\*|#)|uuid[._]?v[45]|randomUUID
why: UUID v1 encodes a timestamp plus the host MAC address, so it is largely predictable and enumerable; using it as a session id, reset token, or API key lets an attacker guess adjacent values.
confidence: high
