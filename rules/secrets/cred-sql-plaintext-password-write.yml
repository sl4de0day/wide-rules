cwe: CWE-256
pattern: (?:update|insert)\b.*\b(?:password|passwd|pwd|secret|api_?key|access_?token)\b.*(?:\$?\{\s*(?:[\w.\[\]']*\.)?(?:password|passwd|pwd|plainpass|rawpass\w*)\b|\+\s*(?:[\w.\[\]']*\.)?(?:password|passwd|pwd)\b|%\s*\(?(?:password|passwd|pwd)\)?s?|\|\|\s*(?:[\w.]*\.)?(?:password|passwd|pwd)\b|\.\s*\$(?:[\w>\-\['"\]]*)?(?:password|passwd|pwd)\b)
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Never store the raw password. Compute a strong slow salted hash (bcrypt/argon2id/scrypt/PBKDF2) first and bind that hash as the column value; keep queries parameterized.
not-match: bcrypt|argon2|scrypt|pbkdf2|password_hash|passwordhash|hashedpassword|hashed|\bhash\b|\bhash\(|\.hash|createhash|digestutils|messagedigest|\bdigest\(|make_password|generate_password_hash|gen_salt|\bcrypt\(|redact|\bmask|\*\*\*|xxxx|^\s*(?:\/\/|#|\*|--|<!--)
why: 'An INSERT/UPDATE writes a password/secret column directly from a plaintext, password-named variable or interpolation (string concat, ${}, #{}, %-format, || or PHP . concat), so the credential lands in the database in cleartext. Parameterized placeholders and hashed/derived values are excluded; notMatch was extended with gen_salt and \bcrypt\( so pgcrypto crypt(...,gen_salt(''bf'')) (a real bcrypt) is not flagged.'
confidence: high
