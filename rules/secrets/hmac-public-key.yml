id: wide/hmac-public-key
name: hmac-public-key
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
  - xhtml
  - vue
  - svelte
cwe: CWE-347
pattern: createHmac\s*\([^,]+,\s*\w*(?:public|pubkey|cert)\w*
message: A public key is used as the HMAC secret (algorithm-confusion).
remediation: Verify RS/ES tokens with the asymmetric verify (public key), and pin the algorithm; never feed a public key to HMAC.
why: If tokens are verified with HMAC keyed by the RSA public key, an attacker who has that public key (it is public) can forge a valid HS256 token for any user.
confidence: high
