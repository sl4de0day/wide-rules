pattern: '["''](?:flag|secret|api[_-]?key|token|password|passwd|private[_-]?key)["'']\s*:\s*(?:os\.getenv|getenv|process\.env|System\.getenv|ENV\[|Environment\.GetEnvironmentVariable)\b'
message: An endpoint returns a secret from the environment.
remediation: Authenticate the caller in this service too (API key, mTLS, or a signed internal header).
why: If this internal service trusts an upstream proxy for auth, anyone who reaches it directly gets the secret — a broken trust boundary.
confidence: high
