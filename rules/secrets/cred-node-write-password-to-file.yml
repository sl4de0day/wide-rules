id: wide/cred-node-write-password-to-file
name: cred-node-write-password-to-file
category: SECRETS
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-312
pattern: fs\.(?:writeFile|writeFileSync|appendFile|appendFileSync)\([^,]+,\s*(?:[^)]*?(?:\+|\$\{)\s*)?[\w.$]*(?:password|passwd|pwd|passphrase|secret|api_?key|apikey|token|credential)\b
message: Cleartext or weakly-hashed credential storage — a password/secret persisted or logged without a strong salted hash (CWE-256/916/532/312).
remediation: Do not persist raw credentials to files. Store a strong salted hash instead, or keep secrets in a secrets manager / OS keychain with restrictive permissions.
not-match: bcrypt|argon2|scrypt|pbkdf2|password_hash|\.hash\(|hashSync|hashsync|createHash|redact|\bmask(?:ed)?\b|\*\*\*|^\s*\/\/
why: fs.writeFile/appendFile writes a password/secret VALUE (bare, member, or concatenated password-named data) as the CONTENT argument to a file, persisting the plaintext credential on disk. The credential is matched only after the path/comma (so a password-named path arg does not fire), and the value prefix is [\w.$]* so userPassword/account.creds.password are caught. Hashed values and redacted placeholders are excluded.
confidence: high
