id: wide/role-session-file-keyed-by-user-php
name: role-session-file-keyed-by-user-php
category: SECRETS
severity: HIGH
languages:
  - php
  - phtml
  - php3
  - php4
  - php5
  - phps
cwe: CWE-807
pattern: \b(file_get_contents|file_put_contents|fopen|fwrite|readfile)\s*\(\s*[^,;)]*(session|role|auth|acl|perm|priv|grant)[^,;)]*(\.|\$)\s*[^,;)]*\b(user(name)?|uid|user_id|login)\b
message: Broken session management — identity/role from an unverified client value or a writable store (CWE-807/302).
remediation: Use PHP's server-side session (keyed by a random session_id) and store roles there or in a trusted DB. Do not build session/role file paths from a raw username.
not-match: \$_SESSION|^\s*(\/\/|#|\*)
why: 'Role/session state is read from or written to a file whose path is concatenated/interpolated from a client-controlled username. A writable, user-keyed authorization file lets an attacker reach or overwrite another user''s privilege data. Sealed a real leak: added a leading \b before the identity group so $superuser / compound names no longer match the internal ''user'' substring; session_id / session_id() / random_bytes keys and $_SESSION are excluded.'
confidence: high
