id: wide/client-jwt-verify-hardcoded-secret
name: client-jwt-verify-hardcoded-secret
category: SECRETS
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - vue
  - svelte
  - html
  - htm
  - xhtml
cwe: CWE-347
pattern: \b(?:jwt|jsonwebtoken)\.verify\s*\([^)]*?,\s*(['"`])[^'"`\r\n]{3,}\1\s*(?:[,)]|$)
message: Client-side token signing or embedded signing key — a secret/decision shipped to the browser is attacker-forgeable.
remediation: Verify tokens on the server with the secret held in a non-public store, and gate access there. If a client genuinely must verify, ship only a public key and verify an asymmetric (RS/ES) signature — never a shared HMAC secret.
not-match: changeme|change[_-]?me|your[-_ ]?(?:secret|key|token|hmac|password)|example|placeholder|sample|dummy|foobar|todo|xxxx?|<[^>\r\n]+>|\$\{|process\.env|BEGIN [\w ]*PUBLIC KEY|BEGIN CERTIFICATE
why: 'jwt.verify(token, <secret>) checks an HS256 signature with a hardcoded string literal key. Because the same symmetric key both signs and verifies, embedding it in the client exposes the signing secret to every user, so any ''valid'' result is forgeable and the verification enforces nothing. Verifying a token to gate access is a server-side decision. (Inline PEM public keys / certificates are suppressed: verifying an RS/ES signature with a public key is the recommended safe pattern.)'
confidence: high
