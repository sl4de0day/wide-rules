cwe: CWE-798
pattern: ':\/\/(?:root:root|admin:admin|postgres:postgres|mysql:mysql|user:user|user:password|guest:guest|sa:sa|redis:redis|mongo:mongo|kafka:kafka|elastic:changeme|admin:changeme|root:password|root:toor|admin:password|test:test|demo:demo)@'
message: Broken access control — a security decision made from a client value, unverified identifier, or unauthenticated service.
remediation: Replace the default account with a unique per-service credential drawn from a secret manager and injected via env, and rotate/disable the shipped default account on the server.
not-match: ^\s*(?:\/\/|\*|#|<!--)|\b(?:example|sample)\b
why: The connection URI embeds a well-known default credential pair (root:root, postgres:postgres, guest:guest, elastic:changeme, etc.). Default credentials are the first thing an attacker tries and are equivalent to no authentication. Note the pair must be immediately followed by @, so a real password merely prefixed with a default word (postgres:postgres_prod_x9@) is not matched.
confidence: high
