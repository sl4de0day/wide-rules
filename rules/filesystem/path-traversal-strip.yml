cwe: CWE-22
pattern: \.replace\s*\(\s*(?:['"]\.\.[\\/]|\/\\?\.\\?\.[\\/])
message: Path traversal is being removed with a single-pass string replace.
remediation: Resolve the path (path.resolve/realpath) and verify it stays inside a fixed canonical base, rather than stripping strings.
why: 'Removing ''../'' once does not sanitise the path: an input such as ''....//'' becomes ''../'' after one replacement, so the traversal survives.'
confidence: high
