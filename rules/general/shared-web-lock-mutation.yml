cwe: CWE-362
pattern: lock[^;\n]*mode\s*:\s*['"]shared['"]|mode\s*:\s*['"]shared['"][^;\n]*lock
message: A Web Lock is acquired in 'shared' mode.
remediation: 'Use { mode: ''exclusive'' } (the default) whenever the locked section changes state.'
why: A shared lock lets several tabs/threads hold it at once, so if the critical section mutates shared state they race and can corrupt it.
confidence: high
