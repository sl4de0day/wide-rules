id: wide/alloc-unsafe
name: alloc-unsafe
category: GENERAL
severity: MEDIUM
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
  - html
  - htm
  - xhtml
  - vue
  - svelte
cwe: CWE-201
pattern: \bBuffer\.allocUnsafe(?:Slow)?\s*\(
message: Buffer.allocUnsafe returns uninitialised memory.
remediation: Use Buffer.alloc(size) (zero-filled), or fully overwrite every byte before exposing the buffer.
why: The buffer may contain whatever was previously in that RAM — other users' tokens, passwords, keys — and if any of it is sent to a client it leaks (uninitialised-memory exposure).
confidence: high
