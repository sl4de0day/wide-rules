cwe: CWE-1004
pattern: httpOnly\s*:\s*false|secure\s*:\s*false|sameSite\s*:\s*['"]none['"]
message: A cookie flag weakens the cookie's protection.
remediation: 'Prefer httpOnly: true, secure: true, and a SameSite of Lax or Strict.'
why: Without HttpOnly a script can read the cookie; without Secure it can travel over http; SameSite=None permits cross-site sending.
confidence: high
