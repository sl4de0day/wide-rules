id: wide/js-wrong-context-event-handler
name: js-wrong-context-event-handler
category: GENERAL
severity: HIGH
languages:
  - js
  - jsx
  - mjs
  - cjs
  - ts
  - tsx
  - mts
  - cts
cwe: CWE-116
pattern: (?<![\w-])on(?:click|load|error|mouseover|mouseout|focus|blur|change|submit|keyup|keydown|dblclick|mousedown|mouseup|input)\s*=(?=[^>\n]*\breq\.(?:query|body|params|cookies|headers))
message: Reflected / context-mismatched XSS — user input reaches HTML or JS output without proper contextual encoding (CWE-79/116).
remediation: Do not put user data in inline handlers; attach behavior via addEventListener reading a data-* attribute, or JSON.stringify the value into the handler. HTML escaping alone is insufficient for this context.
not-match: (?:^\s*(?:\/\/|\*)|JSON\.stringify|encodeURIComponent)
why: User data is placed inside an inline event-handler attribute (onclick=, onerror=, ...) and appears before the tag's closing >, which is a JavaScript execution context. HTML-entity escaping is the wrong encoder and does not stop breakout, so the value runs as script -> context-mismatched-encoding XSS. The lookbehind excludes data-onclick-style attribute names and the [^>] bound stops an unrelated req later on the line from matching; lowercase handler names avoid React's camelCase onClick={} JSX.
confidence: high
